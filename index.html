<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz 30 de Septiembre ❤️</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Nunito:wght@400;800&display=swap');

  :root {
    --primary-blue: #0055ff;
    --neon-blue: #00d4ff;
    --lazo-color: #ff0055;
    --lazo-oscuro: #cc0044;
  }

  body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #020510; overflow: hidden; font-family: 'Nunito', sans-serif; color: white; user-select: none; touch-action: none; }
  
  /* --- PANTALLA DE CARGA --- */
  #pantallaEntrada {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #020510; z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 1s ease;
  }
  #textoCarga { font-size: 1.5rem; color: var(--neon-blue); letter-spacing: 2px; margin-bottom: 20px; animation: parpadeo 1.5s infinite; font-weight: bold; }
  .barra-contenedor { width: 80%; max-width: 300px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
  .barra-progreso { width: 0%; height: 100%; background: linear-gradient(90deg, var(--primary-blue), var(--neon-blue)); transition: width 0.1s linear; }

  #btnDescubrir {
    display: none; padding: 15px 40px; font-size: 1.2rem; font-weight: bold; text-transform: uppercase;
    background: transparent; color: var(--neon-blue); border: 2px solid var(--neon-blue); border-radius: 30px;
    cursor: pointer; letter-spacing: 2px; box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
    transition: all 0.3s; margin-top: 30px; animation: latido 2s infinite;
  }
  #btnDescubrir:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 30px var(--neon-blue); }

  /* --- ESCENA 1: EL RAMO REALISTA --- */
  #escenaRamo {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, #0a1535 0%, #020510 100%);
    z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 1.5s ease;
  }
  .ramo-titulo { font-family: 'Caveat', cursive; font-size: clamp(2.5rem, 6vw, 4rem); color: #fff; text-shadow: 0 0 15px var(--primary-blue), 0 0 30px var(--neon-blue); margin-bottom: 10px; opacity: 0; animation: fadeIn 2s forwards 0.5s; text-align: center; }
  
  .ramo-wrapper {
    position: relative; width: 360px; height: 500px; margin-top: 10px;
  }

  /* Cono del ramo */
  .capa-fondo { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 280px; height: 350px; background: linear-gradient(to bottom, #1d4ed8, #1e3a8a); clip-path: polygon(0 0, 100% 0, 65% 100%, 35% 100%); z-index: 1; opacity: 0; animation: surgir 1s forwards 1s; box-shadow: inset 0 20px 50px rgba(0,0,0,0.5); }
  .capa-frente { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 300px; height: 280px; background: linear-gradient(135deg, #3b82f6, #1e40af); clip-path: polygon(5% 0, 95% 0, 65% 100%, 35% 100%); z-index: 10; opacity: 0; animation: surgir 1s forwards 1.2s; box-shadow: 0 -10px 30px rgba(0,0,0,0.4); }
  
  /* Imágenes de las Flores Reales */
  .capa-flores { position: absolute; width: 100%; height: 100%; z-index: 8; pointer-events: none; }
  .flor-img { position: absolute; width: 65px; height: 65px; object-fit: contain; opacity: 0; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5)); }
  .flor1 { top: 120px; left: 20px; transform: rotate(-15deg); animation: popUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 1.5s; }
  .flor2 { top: 90px; right: 20px; transform: rotate(20deg); width: 75px; height: 75px; animation: popUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 1.7s; }
  .flor3 { top: 180px; left: 60px; animation: popUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 1.9s; }
  .flor4 { top: 170px; right: 60px; width: 70px; height: 70px; animation: popUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 2.1s; }

  /* Cajas Hot Wheels con la Plantilla JPG */
  .caja-hw {
    position: absolute; width: 95px; height: 135px;
    background-image: url('plantilla.jpg'); background-size: cover; background-position: center;
    border-radius: 8px; box-shadow: 0 10px 20px rgba(0,0,0,0.7);
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    cursor: pointer; opacity: 0; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.3s;
    transform-origin: bottom center; padding-bottom: 5px;
  }
  .caja-hw:hover { transform: scale(1.15) translateY(-15px) !important; z-index: 20 !important; filter: brightness(1.2); box-shadow: 0 15px 30px var(--neon-blue); }
  .caja-img { width: 90%; height: 60px; object-fit: contain; margin-bottom: 5px; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.8)); }

  /* Posiciones de las cajas */
  .hw1 { top: 10px; left: 20px; transform: rotate(-18deg); z-index: 4; animation: popUp 0.6s forwards 2.4s; }
  .hw2 { top: -10px; left: 130px; transform: rotate(0deg); z-index: 4; animation: popUp 0.6s forwards 2.6s; }
  .hw3 { top: 20px; right: 20px; transform: rotate(18deg); z-index: 4; animation: popUp 0.6s forwards 2.8s; }
  .hw4 { top: 110px; left: 0px; transform: rotate(-25deg); z-index: 5; animation: popUp 0.6s forwards 3.0s; }
  .hw5 { top: 100px; left: 130px; transform: rotate(0deg); z-index: 5; animation: popUp 0.6s forwards 3.2s; }
  .hw6 { top: 120px; right: 0px; transform: rotate(25deg); z-index: 5; animation: popUp 0.6s forwards 3.4s; }

  /* Botón Lazo Central para ir a Galaxia */
  #btnGalaxia {
    position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%);
    width: 140px; height: 50px; background: var(--lazo-color);
    border: 2px solid #ff4d88; border-radius: 40px;
    color: #fff; font-weight: 800; font-size: 1rem; letter-spacing: 1px;
    cursor: pointer; z-index: 50; opacity: 0;
    box-shadow: 0 10px 20px rgba(0,0,0,0.6), inset 0 -5px 10px rgba(0,0,0,0.2);
    display: flex; align-items: center; justify-content: center;
    animation: fadeIn 2s forwards 4.5s, latido 2s infinite 4.5s;
    transition: 0.3s;
  }
  #btnGalaxia:hover { background: #ff3377; transform: translateX(-50%) scale(1.1); box-shadow: 0 10px 30px var(--lazo-color); }
  /* Nudos del lazo */
  #btnGalaxia::before, #btnGalaxia::after {
    content: ''; position: absolute; top: 5px; width: 45px; height: 40px;
    background: var(--lazo-oscuro); border-radius: 50%; z-index: -1;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
  }
  #btnGalaxia::before { left: -15px; }
  #btnGalaxia::after { right: -15px; }

  /* --- ESCENA 2: GALAXIA 3D --- */
  #threeCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: none; }
  
  /* Título de la Galaxia */
  #ui-galaxia {
    position: absolute; top: 30px; width: 100%; text-align: center; z-index: 10; display: none; pointer-events: none;
  }
  #ui-galaxia h1 { 
    margin: 0; font-size: clamp(2.5rem, 5vw, 4rem); color: #fff; 
    text-shadow: 0 0 20px var(--lazo-color), 0 0 40px var(--neon-blue); font-weight: 800; font-family: 'Caveat', cursive; 
    animation: flotar 3s infinite ease-in-out;
  }
  #ui-galaxia p { margin-top: 10px; font-size: 1.2rem; color: #ddd; background: rgba(0, 0, 20, 0.6); display: inline-block; padding: 8px 20px; border-radius: 20px; border: 1px solid var(--primary-blue); }

  /* --- TARJETA MODAL UNIVERSAL --- */
  #modalMensaje {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -45%) scale(0.9);
    background: rgba(255, 255, 255, 0.98); border: 4px solid var(--primary-blue); border-radius: 20px;
    width: 85%; max-width: 380px; padding: 35px 25px; text-align: center; color: #111;
    z-index: 10000; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 85, 255, 0.3);
    opacity: 0; pointer-events: none; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  #modalMensaje.mostrar { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
  #modalTitulo { font-size: 1.6rem; color: var(--primary-blue); margin-bottom: 15px; font-weight: 900; letter-spacing: 1px; }
  .modal-img-tierna { font-size: 5rem; margin: 15px 0; display: block; animation: flotar 3s ease-in-out infinite; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2)); }
  #modalTexto { font-size: 1.2rem; line-height: 1.5; margin-bottom: 30px; font-weight: 700; color: #444; }
  .btn-cerrar { background: var(--primary-blue); color: #fff; border: none; padding: 12px 40px; border-radius: 30px; font-size: 1.1rem; font-weight: 900; cursor: pointer; box-shadow: 0 8px 15px rgba(0, 85, 255, 0.4); transition: 0.2s; }
  .btn-cerrar:hover { transform: translateY(-3px); box-shadow: 0 12px 20px rgba(0, 85, 255, 0.6); }

  /* ANIMACIONES */
  @keyframes parpadeo { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  @keyframes latido { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.05); } }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes surgir { 0% { transform: translateX(-50%) translateY(100px); opacity: 0; } 100% { transform: translateX(-50%) translateY(0); opacity: 1; } }
  @keyframes popUp { 0% { transform: scale(0.5) translateY(100px); opacity: 0; } 100% { opacity: 1; } }
  @keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// --- LÓGICA DE CARGA ---
let porcentaje = 0;
const intervaloCarga = setInterval(() => {
  porcentaje += Math.floor(Math.random() * 8) + 2;
  if(porcentaje >= 100) {
    porcentaje = 100;
    clearInterval(intervaloCarga);
    document.getElementById('textoCarga').innerText = "¡TODO LISTO!";
    document.getElementById('barraProgreso').parentElement.style.display = 'none';
    document.getElementById('btnDescubrir').style.display = 'block';
  }
  document.getElementById('textoCarga').innerText = `ENSAMBLANDO SORPRESA... ${porcentaje}%`;
  document.getElementById('barraProgreso').style.width = `${porcentaje}%`;
}, 100);

document.getElementById('btnDescubrir').addEventListener('click', () => {
  document.getElementById('musicaFondo').play().catch(e=>console.log(e));
  document.getElementById('pantallaEntrada').style.opacity = '0';
  setTimeout(() => { document.getElementById('pantallaEntrada').style.display = 'none'; }, 1000);
});

// --- LÓGICA DEL MODAL ---
function abrirModal(titulo, texto) {
  document.getElementById('modalTitulo').innerText = titulo;
  document.getElementById('modalTexto').innerText = texto;
  document.getElementById('modalMensaje').classList.add('mostrar');
}
function cerrarModal() {
  document.getElementById('modalMensaje').classList.remove('mostrar');
}

// --- TRANSICIÓN A LA GALAXIA ---
function iniciarTransicionGalaxia() {
  const escenaRamo = document.getElementById('escenaRamo');
  escenaRamo.style.opacity = '0';
  
  setTimeout(() => {
    escenaRamo.style.display = 'none';
    document.getElementById('threeCanvas').style.display = 'block';
    document.getElementById('ui-galaxia').style.display = 'block';
    initThreeJS();
  }, 1500);
}

// --- BANCO MASIVO DE MENSAJES ÚNICOS ---
const bancoDeMensajes = [
  { t: "MI MEJOR DECISIÓN", p: "Amarte ha sido la carrera más hermosa de mi vida." },
  { t: "SIN FRENOS", p: "Me enamoré de ti sin frenos y sin marcha atrás." },

  { t: "MI DESTINO FINAL", p: "No importa la ruta, mi destino siempre eres tú." },
  { t: "HOT WHEELS", p: "Gracias por dejarme hacer feliz a tu niño interior." },
  { t: "MI COPILOTO IDEAL", p: "La vida es un viaje, gracias por ir a mi lado." },
  { t: "PRIMERA POSICIÓN", p: "En la carrera de mi vida, tú siempre tienes el primer lugar." },
  { t: "ADRENALINA PURA", p: "Eso es exactamente lo que siento cuando me miras." },
  { t: "MI META", p: "De todos los caminos posibles, siempre te elegiré a ti." },
  { t: "CERO A CIEN", p: "Me haces pasar de 0 a 100 de felicidad en un segundo." },
  { t: "MOTOR DE MI VIDA", p: "Tú le das la fuerza y energía a todos mis días." },
  { t: "PISTA FAVORITA", p: "Quiero recorrer cada curva de la vida a tu lado." },
  { t: "TURBO ACTIVADO", p: "Mi sonrisa se enciende a máxima potencia contigo." },
  { t: "LUCES EN LA NOCHE", p: "Tu amor ilumina mi camino cuando todo está oscuro." },
  { t: "MI CAMPEÓN", p: "Ganar tu corazón ha sido mi mayor y mejor victoria." },
  { t: "AMOR CLÁSICO", p: "Lo nuestro es como un buen auto clásico: nunca pasa de moda." },
  { t: "SÚPER MOTOR", p: "Gracias por darle tanta fuerza y amor a mis días." },
  { t: "LLANTAS AL ASFALTO", p: "Me mantienes con los pies en la tierra pero el corazón volando." },
  { t: "ESCUDERÍA PERFECTA", p: "Juntos somos el mejor equipo que existe." },
  { t: "V8 DE EMOCIONES", p: "Haces vibrar todo mi mundo con solo hablarme." },
  { t: "MI SUPERCAR", p: "No hay nadie que se compare contigo, eres perfecto para mí." },
  { t: "VUELTA RÁPIDA", p: "El tiempo vuela demasiado rápido cuando estoy contigo." },
  { t: "TRACCIÓN TOTAL", p: "Contigo me siento segura en cualquier terreno." },
  { t: "ALINEACIÓN PERFECTA", p: "Tú le das el equilibrio exacto a mi universo." }
];

function shuffleArray(array) {
  let currentIndex = array.length, randomIndex;
  while (currentIndex !== 0) {
    randomIndex = Math.floor(Math.random() * currentIndex);
    currentIndex--;
    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
  }
  return array;
}

// --- ESCENA 2: THREE.JS GALAXIA ---
let scene, camera, renderer, controls;
let universoGroup = new THREE.Group();
let carritosInteractivos = [];
let anillosGalaxia = [];
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function initThreeJS() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x020510);
  scene.fog = new THREE.FogExp2(0x020510, 0.00025);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 15000);
  camera.position.set(0, 400, 1600); 

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.getElementById('threeCanvas').appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.8;
  controls.maxDistance = 2500;
  controls.minDistance = 300;

  scene.add(universoGroup);

  crearFondoEstelar();
  crearAgujeroNegroAnimado();
  crearGalaxia();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  
  renderer.domElement.addEventListener('pointerdown', onPointerDown);
  renderer.domElement.addEventListener('pointerup', onPointerUp);

  animate();
}

function crearSpriteTextoFlotante(texto) {
  const canvas = document.createElement('canvas');
  canvas.width = 1024; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.font = '50px "Caveat", cursive, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = '#0055ff'; ctx.shadowBlur = 15;
  ctx.fillText(texto, 512, 64);
  const texture = new THREE.CanvasTexture(canvas);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0.7 }));
  sprite.scale.set(350, 45, 1);
  return sprite;
}

function crearFondoEstelar() {
  const starGeo = new THREE.BufferGeometry(); const starPos = [];
  for(let i=0; i<5000; i++) starPos.push((Math.random()-0.5)*6000, (Math.random()-0.5)*6000, (Math.random()-0.5)*6000);
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xcceeff, size: 2, transparent: true, opacity: 0.6})));
}

function crearAgujeroNegroAnimado() {
  const diskGroup = new THREE.Group();
  const matAnillo = (color, opacidad) => new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide, transparent: true, opacity: opacidad, wireframe: true });

  const ring1 = new THREE.Mesh(new THREE.RingGeometry(180, 260, 64, 4), new THREE.MeshBasicMaterial({color: 0xe0ffff, side: THREE.DoubleSide, transparent: true, opacity: 0.9}));
  const ring2 = new THREE.Mesh(new THREE.RingGeometry(260, 360, 64, 2), matAnillo(0x00aaff, 0.4));
  const ring3 = new THREE.Mesh(new THREE.RingGeometry(360, 550, 64, 1), matAnillo(0x0055ff, 0.15));
  
  anillosGalaxia.push(ring1, ring2, ring3);
  diskGroup.add(ring1, ring2, ring3);
  diskGroup.rotation.x = Math.PI / 2;
  universoGroup.add(diskGroup);
  universoGroup.add(new THREE.Mesh(new THREE.SphereGeometry(175, 32, 32), new THREE.MeshBasicMaterial({ color: 0x000000 })));
}

function crearGalaxia() {
  const loader = new THREE.TextureLoader();
  const texturasAutos = [
    loader.load('auto1.png'), loader.load('auto2.png'), loader.load('auto3.png'),
    loader.load('auto4.png'), loader.load('auto5.png'), loader.load('auto6.png')
  ];

  const frasesFlotantes = ["Acelerando hacia ti", "Contigo la carretera es mejor", "Mi copiloto de vida", "Eres mi persona favorita", "Feliz día para ti", "Mi universo entero", "A toda máquina"];
  const mensajesAleatorios = shuffleArray([...bancoDeMensajes]);

  // Textos ambientales (No interactivos)
  for(let i=0; i<70; i++) {
    const radio = 450 + Math.random() * 2200;
    const angulo = Math.random() * Math.PI * 2;
    const altura = (Math.random() - 0.5) * 800 * (1 - radio/2800); 
    const spriteTexto = crearSpriteTextoFlotante(frasesFlotantes[Math.floor(Math.random() * frasesFlotantes.length)]);
    spriteTexto.position.set(Math.cos(angulo) * radio, altura, Math.sin(angulo) * radio);
    spriteTexto.userData = { anguloBase: angulo, radio: radio, velocidad: 0.0004 + Math.random() * 0.0008 };
    universoGroup.add(spriteTexto);
  }

  // Carritos Interactivos (Imágenes directas de los autos sin la plantilla)
  const cantidadAutos = 25; 
  for(let i=0; i<cantidadAutos; i++) {
    const radio = 500 + Math.random() * 1900;
    const angulo = Math.random() * Math.PI * 2;
    const altura = (Math.random() - 0.5) * 450; 
    
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texturasAutos[Math.floor(Math.random() * texturasAutos.length)], transparent: true }));
    sprite.scale.set(200, 100, 1); 
    sprite.position.set(Math.cos(angulo) * radio, altura, Math.sin(angulo) * radio);
    
    sprite.userData = { 
      mensaje: mensajesAleatorios[i], 
      anguloBase: angulo, 
      radio: radio, 
      velocidad: 0.001 + Math.random() * 0.0012 
    };

    carritosInteractivos.push(sprite); 
    universoGroup.add(sprite);
  }
}

// --- LÓGICA DE CLICS ---
let posInicio = { x: 0, y: 0 }, tiempoInicio = 0;
function onPointerDown(e) {
  posInicio.x = e.clientX || (e.touches ? e.touches[0].clientX : 0);
  posInicio.y = e.clientY || (e.touches ? e.touches[0].clientY : 0);
  tiempoInicio = Date.now();
}

function onPointerUp(e) {
  let endX = e.clientX || (e.changedTouches ? e.changedTouches[0].clientX : 0);
  let endY = e.clientY || (e.changedTouches ? e.changedTouches[0].clientY : 0);
  
  if (Math.hypot(endX - posInicio.x, endY - posInicio.y) < 15 && Date.now() - tiempoInicio < 400) {
    mouse.x = (endX / window.innerWidth) * 2 - 1; mouse.y = -(endY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(carritosInteractivos);
    if (intersects.length > 0) {
      const obj = intersects[0].object; 
      abrirModal(obj.userData.mensaje.t, obj.userData.mensaje.p);
      
      const escX = 200, escY = 100;
      obj.scale.set(escX*1.4, escY*1.4, 1); 
      setTimeout(() => obj.scale.set(escX, escY, 1), 300);
    }
  }
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  universoGroup.rotation.y -= 0.0005;
  
  if(anillosGalaxia.length === 3) {
    anillosGalaxia[0].rotation.z -= 0.02; 
    anillosGalaxia[1].rotation.z -= 0.008; 
    anillosGalaxia[2].rotation.z -= 0.003;
  }
  
  universoGroup.children.forEach(c => {
    if(c.userData && c.userData.radio) {
      c.userData.anguloBase += c.userData.velocidad;
      c.position.x = Math.cos(c.userData.anguloBase) * c.userData.radio;
      c.position.z = Math.sin(c.userData.anguloBase) * c.userData.radio;
    }
  });
  renderer.render(scene, camera);
}
</script>
