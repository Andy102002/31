<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz 30 de Septiembre ❤️</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Nunito:wght@400;800&display=swap');

  :root {
    --bg-dark: #020510;
    --primary-blue: #0055ff;
    --neon-blue: #00d4ff;
    --hw-blue: #0033cc;
    --hw-red: #e60000;
    --hw-yellow: #ffcc00;
    --leaf-green: #15803d;
  }

  * { box-sizing: border-box; }
  body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg-dark); overflow: hidden; font-family: 'Nunito', sans-serif; color: white; user-select: none; touch-action: none; }
  
  /* --- 1. PANTALLA DE CARGA --- */
  #pantallaEntrada {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark); z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    transition: opacity 1s ease;
  }
  #textoCarga { font-size: 1.5rem; color: var(--neon-blue); letter-spacing: 2px; margin-bottom: 20px; animation: parpadeo 1.5s infinite; font-weight: bold; text-transform: uppercase; }
  .barra-contenedor { width: 80%; max-width: 350px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin: 0 auto; }
  .barra-progreso { width: 0%; height: 100%; background: linear-gradient(90deg, var(--primary-blue), var(--neon-blue)); transition: width 0.1s linear; }

  #btnDescubrir {
    display: none; padding: 15px 50px; font-size: 1.2rem; font-weight: 900; text-transform: uppercase;
    background: transparent; color: var(--neon-blue); border: 2px solid var(--neon-blue); border-radius: 30px;
    cursor: pointer; letter-spacing: 2px; box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
    transition: all 0.3s; margin-top: 40px; animation: latido 2s infinite;
  }
  #btnDescubrir:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 40px var(--neon-blue); }

  /* --- 2. ESCENA DEL RAMO --- */
  #escenaRamo {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, #0a1535 0%, var(--bg-dark) 100%);
    z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 1.5s ease;
  }
  
  .ramo-titulo { 
    font-family: 'Caveat', cursive; font-size: clamp(2.5rem, 6vw, 4.5rem); color: #fff; 
    text-shadow: 0 0 15px var(--primary-blue), 0 0 30px var(--neon-blue); 
    margin-bottom: 10px; opacity: 0; animation: fadeIn 2s forwards 0.5s; text-align: center; 
  }
  
  /* CONTENEDOR MAESTRO - Garantiza que nada se descuadre */
  .ramo-master {
    position: relative; width: 380px; height: 500px; 
    display: flex; justify-content: center; align-items: flex-end;
  }

  /* Papel del ramo */
  .papel-atras {
    position: absolute; bottom: 50px; left: 0; width: 100%; height: 420px;
    background: linear-gradient(to bottom, #3b82f6, #1e3a8a);
    clip-path: polygon(15% 0, 85% 0, 60% 100%, 40% 100%);
    z-index: 1; opacity: 0; animation: surgir 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 0.8s;
  }
  .papel-frente {
    position: absolute; bottom: 50px; left: 0; width: 100%; height: 260px;
    background: linear-gradient(135deg, #60a5fa, #2563eb);
    clip-path: polygon(0 0, 100% 0, 60% 100%, 40% 100%);
    z-index: 30; opacity: 0; animation: surgir 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 3.5s;
    box-shadow: 0 -15px 30px rgba(0,0,0,0.5);
  }

  /* Tallos */
  .tallos-container { position: absolute; bottom: 50px; left: 0; width: 100%; height: 350px; z-index: 2; }
  .tallo { position: absolute; bottom: 0; width: 6px; background: var(--leaf-green); transform-origin: bottom center; border-radius: 5px; opacity: 0; animation: crecer 1s forwards; }
  .t1 { left: 40%; height: 320px; transform: rotate(-25deg); animation-delay: 1.2s; }
  .t2 { left: 50%; height: 350px; transform: rotate(-5deg); animation-delay: 1.4s; }
  .t3 { left: 60%; height: 330px; transform: rotate(20deg); animation-delay: 1.6s; }
  .t4 { left: 35%; height: 250px; transform: rotate(-40deg); animation-delay: 1.8s; }
  .t5 { left: 65%; height: 260px; transform: rotate(35deg); animation-delay: 2.0s; }

  /* FLORES INTEGRADAS SVG (Capas de Fondo y Frente para dar profundidad 3D) */
  .flor { position: absolute; width: 90px; height: 90px; opacity: 0; transform-origin: center; animation: florecer 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5)); }
  .flor-fondo { z-index: 3; }
  .flor-frente { z-index: 25; } /* Van encima de los autos */
  
  .ff1 { bottom: 280px; left: 20px; animation-delay: 1.8s; transform: rotate(-15deg); }
  .ff2 { bottom: 330px; left: 145px; width: 110px; height: 110px; animation-delay: 2.0s; }
  .ff3 { bottom: 290px; right: 20px; animation-delay: 2.2s; transform: rotate(20deg); }
  .ff4 { bottom: 190px; left: -10px; animation-delay: 2.4s; width: 80px; height: 80px; }
  .ff5 { bottom: 200px; right: -10px; animation-delay: 2.6s; width: 85px; height: 85px; }
  .ff6 { bottom: 220px; left: 100px; animation-delay: 3.6s; width: 75px; height: 75px; } /* Flor frontal */
  .ff7 { bottom: 230px; right: 90px; animation-delay: 3.8s; width: 80px; height: 80px; transform: rotate(45deg); } /* Flor frontal */

  /* CAJAS HOT WHEELS */
  .cajas-container { position: absolute; bottom: 50px; left: 0; width: 100%; height: 400px; z-index: 15; }
  .blister-card {
    position: absolute; width: 85px; height: 130px;
    background: linear-gradient(180deg, var(--hw-blue) 0%, #001144 100%);
    border-radius: 8px 8px 5px 5px; border: 2px solid rgba(255,255,255,0.8);
    box-shadow: 0 10px 20px rgba(0,0,0,0.6); display: flex; flex-direction: column; align-items: center;
    cursor: pointer; opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    transform-origin: bottom center;
  }
  .blister-card:hover { transform: scale(1.3) translateY(-15px) !important; z-index: 50 !important; box-shadow: 0 15px 30px var(--neon-blue); filter: brightness(1.2); }
  .blister-hueco { width: 25px; height: 8px; background: var(--bg-dark); border-radius: 0 0 10px 10px; border: 1px solid rgba(255,255,255,0.5); border-top: none; margin-bottom: 5px; }
  .blister-logo { background: var(--hw-red); color: var(--hw-yellow); font-size: 0.5rem; font-weight: 900; font-style: italic; padding: 2px 8px; border-radius: 10px; border: 1px solid #fff; margin-bottom: auto; }
  .blister-burbuja { width: 90%; height: 70px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-bottom: 5px; border: 1px solid rgba(255,255,255,0.3); display: flex; justify-content: center; align-items: center; box-shadow: inset 0 5px 10px rgba(255,255,255,0.2); }
  .blister-auto-img { width: 95%; height: 50px; object-fit: contain; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.8)); }

  .hw1 { bottom: 180px; left: 20px; transform: rotate(-25deg); animation: popUp 0.7s forwards 2.8s; }
  .hw2 { bottom: 250px; left: 80px; transform: rotate(-10deg); animation: popUp 0.7s forwards 3.0s; }
  .hw3 { bottom: 260px; right: 80px; transform: rotate(10deg); animation: popUp 0.7s forwards 3.2s; }
  .hw4 { bottom: 190px; right: 20px; transform: rotate(25deg); animation: popUp 0.7s forwards 3.4s; }
  .hw5 { bottom: 130px; left: 145px; transform: rotate(0deg); animation: popUp 0.7s forwards 3.6s; z-index: 18;}

  /* Botón GALAXIA (El Lazo del Ramo) */
  #btnGalaxia {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    width: 180px; height: 60px; background: linear-gradient(to bottom, #ff0055, #cc0044);
    border: 2px solid #ff4d88; border-radius: 40px; color: #fff; font-weight: 900; font-size: 1.2rem; letter-spacing: 2px;
    cursor: pointer; opacity: 0; box-shadow: 0 10px 25px rgba(0,0,0,0.8), inset 0 5px 10px rgba(255,255,255,0.3);
    display: flex; align-items: center; justify-content: center; z-index: 50;
    animation: fadeIn 1.5s forwards 4.5s, latidoLazo 2s infinite 4.5s; transition: 0.3s;
  }
  #btnGalaxia:hover { background: #ff3377; transform: translateX(-50%) scale(1.1); box-shadow: 0 10px 40px #ff0055; }
  #btnGalaxia::before, #btnGalaxia::after { content: ''; position: absolute; top: 5px; width: 60px; height: 50px; background: #cc0044; border-radius: 50%; z-index: -1; box-shadow: inset 0 0 15px rgba(0,0,0,0.6); }
  #btnGalaxia::before { left: -30px; transform: rotate(-20deg); }
  #btnGalaxia::after { right: -30px; transform: rotate(20deg); }

  /* --- 3. ESCENA GALAXIA 3D --- */
  #threeCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: none; }
  #ui-galaxia { position: absolute; top: 30px; width: 100%; text-align: center; z-index: 10; display: none; pointer-events: none; }
  #ui-galaxia h1 { margin: 0; font-size: clamp(2.5rem, 5vw, 4.5rem); color: #fff; text-shadow: 0 0 20px #ff0055, 0 0 40px var(--neon-blue); font-weight: 800; font-family: 'Caveat', cursive; animation: flotar 3s infinite ease-in-out; }
  #ui-galaxia p { margin-top: 10px; font-size: 1.1rem; color: #fff; background: rgba(0, 0, 20, 0.7); display: inline-block; padding: 8px 25px; border-radius: 30px; border: 1px solid var(--neon-blue); text-transform: uppercase; font-weight: bold; }

  /* --- TARJETA MODAL --- */
  #modalMensaje {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -45%) scale(0.9);
    background: rgba(255, 255, 255, 0.98); border: 4px solid var(--primary-blue); border-radius: 20px;
    width: 85%; max-width: 380px; padding: 35px 25px; text-align: center; color: #111;
    z-index: 10000; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 85, 255, 0.3);
    opacity: 0; pointer-events: none; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  #modalMensaje.mostrar { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
  #modalTitulo { font-size: 1.6rem; color: var(--primary-blue); margin-bottom: 10px; font-weight: 900; text-transform: uppercase; }
  .modal-img-tierna { font-size: 4.5rem; margin: 15px 0; display: block; animation: flotar 3s ease-in-out infinite; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.2)); }
  #modalTexto { font-size: 1.4rem; line-height: 1.4; margin-bottom: 30px; font-weight: 700; color: #333; font-family: 'Caveat', cursive;}
  .btn-cerrar { background: var(--primary-blue); color: #fff; border: none; padding: 12px 40px; border-radius: 30px; font-size: 1.1rem; font-weight: 900; cursor: pointer; box-shadow: 0 8px 15px rgba(0, 85, 255, 0.4); transition: 0.2s; }
  .btn-cerrar:hover { transform: translateY(-3px); box-shadow: 0 12px 20px rgba(0, 85, 255, 0.6); }

  /* ANIMACIONES */
  @keyframes parpadeo { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  @keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  @keyframes latidoLazo { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.05); } }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes surgir { 0% { transform: translateY(150px) scale(0.8); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
  @keyframes crecer { 0% { transform: scaleY(0); opacity: 0; } 100% { transform: scaleY(1); opacity: 1; } }
  @keyframes florecer { 0% { transform: scale(0) rotate(-45deg); opacity: 0; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
  @keyframes popUp { 0% { transform: scale(0) translateY(100px); opacity: 0; } 100% { opacity: 1; } }
  @keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
</style>
</head>
<body>

<audio id="musicaFondo" loop crossorigin="anonymous"><source src="cancion.mp3" type="audio/mpeg"></audio>

<!-- 1. PANTALLA DE CARGA -->
<div id="pantallaEntrada">
  <div id="textoCarga">ENSAMBLANDO SORPRESA... 0%</div>
  <div class="barra-contenedor"><div class="barra-progreso" id="barraProgreso"></div></div>
  <button id="btnDescubrir">ABRIR REGALO</button>
</div>

<!-- 2. ESCENA DEL RAMO -->
<div id="escenaRamo">
  <div class="ramo-titulo">❤️ Feliz 30 de Septiembre ❤️</div>
  
  <div class="ramo-master">
    <!-- Papel Trasero -->
    <div class="papel-atras"></div>
    
    <!-- Tallos -->
    <div class="tallos-container">
      <div class="tallo t1"></div><div class="tallo t2"></div><div class="tallo t3"></div>
      <div class="tallo t4"></div><div class="tallo t5"></div>

    <!-- FLORES DE FONDO (SVG directo, imposible que fallen) -->
    <div class="flor flor-fondo ff1">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 10 C60 -10 90 10 75 40 C100 25 110 55 80 70 C95 95 65 110 50 85 C35 110 5 95 20 70 C-10 55 0 25 25 40 C10 10 40 -10 50 10 Z" fill="#00d4ff" stroke="#0055ff" stroke-width="2"/>

    <div class="flor flor-fondo ff2">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 10 C60 -10 90 10 75 40 C100 25 110 55 80 70 C95 95 65 110 50 85 C35 110 5 95 20 70 C-10 55 0 25 25 40 C10 10 40 -10 50 10 Z" fill="#3388ff" stroke="#0033aa" stroke-width="2"/>
        <path d="M50 20 C55 5 75 20 65 45 C85 35 95 55 70 65 C80 85 60 95 50 75 C40 95 20 85 30 65 C5 55 15 35 35 45 C25 20 45 5 50 20 Z" fill="#0044cc"/>
        <circle cx="50" cy="50" r="14" fill="#ffcc00" stroke="#e60000" stroke-width="3"/>

    <div class="flor flor-fondo ff3">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">

        <path d="M50 20 C55 5 75 20 65 45 C85 35 95 55 70 65 C80 85 60 95 50 75 C40 95 20 85 30 65 C5 55 15 35 35 45 C25 20 45 5 50 20 Z" fill="#0055ff"/>
        <circle cx="50" cy="50" r="12" fill="#ffaa00" stroke="#cc0000" stroke-width="3"/>
      </svg>
    </div>
    <div class="flor flor-fondo ff4">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 10 C60 -10 90 10 75 40 C100 25 110 55 80 70 C95 95 65 110 50 85 C35 110 5 95 20 70 C-10 55 0 25 25 40 C10 10 40 -10 50 10 Z" fill="#00aaff" stroke="#0033cc" stroke-width="2"/>
        <circle cx="50" cy="50" r="10" fill="#ffcc00" stroke="#e60000" stroke-width="2"/>
      </svg>
    </div>
    <div class="flor flor-fondo ff5">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 10 C60 -10 90 10 75 40 C100 25 110 55 80 70 C95 95 65 110 50 85 C35 110 5 95 20 70 C-10 55 0 25 25 40 C10 10 40 -10 50 10 Z" fill="#00d4ff" stroke="#0055ff" stroke-width="2"/>

    <!-- CAJAS HOT WHEELS -->
    <div class="cajas-container">
      <div class="blister-card hw1" onclick="abrirModal('ERES MI ALEGRÍA', 'Tu alegría hace que mi vida sea más bonita 😍')">
        <div class="blister-hueco"></div><div class="blister-logo">HOT WHEELS</div><div class="blister-burbuja"><img src="auto1.png" class="blister-auto-img" onerror="this.style.display='none'"></div>

      </div>
      <div class="blister-card hw3" onclick="abrirModal('TE ADORO', 'Recuerda que eres capaz de todo. Yo creo en ti siempre ❤️')">

      </div>
      <div class="blister-card hw4" onclick="abrirModal('ERES VALIOSO', 'Quiero desearte todo el éxito del mundo en cada meta que persigas 🥰')">

<!-- LIBRERÍAS THREE.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
// --- LÓGICA DE CARGA ---
let porcentaje = 0;
const intervaloCarga = setInterval(() => {
  porcentaje += Math.floor(Math.random() * 8) + 2;
  if(porcentaje >= 100) {
    porcentaje = 100;
    clearInterval(intervaloCarga);
    document.getElementById('textoCarga').innerText = "¡SISTEMA LISTO!";
    document.getElementById('barraProgreso').parentElement.style.display = 'none';
    document.getElementById('btnDescubrir').style.display = 'block';
  }
  document.getElementById('textoCarga').innerText = `ENSAMBLANDO SORPRESA... ${porcentaje}%`;
  document.getElementById('barraProgreso').style.width = `${porcentaje}%`;
}, 100);

document.getElementById('btnDescubrir').addEventListener('click', () => {
  document.getElementById('musicaFondo').play().catch(e=>console.log(e));
  document.getElementById('pantallaEntrada').style.opacity = '0';
  setTimeout(() => { document.getElementById('pantallaEntrada').style.display = 'none'; }, 1000);
});

function abrirModal(titulo, texto) {
  document.getElementById('modalTitulo').innerText = titulo;
  document.getElementById('modalTexto').innerText = texto;
  document.getElementById('modalMensaje').classList.add('mostrar');
}
function cerrarModal() {
  document.getElementById('modalMensaje').classList.remove('mostrar');
}

function iniciarTransicionGalaxia() {
  const escenaRamo = document.getElementById('escenaRamo');
  escenaRamo.style.opacity = '0';
  setTimeout(() => {
    escenaRamo.style.display = 'none';
    document.getElementById('threeCanvas').style.display = 'block';
    document.getElementById('ui-galaxia').style.display = 'block';
    initThreeJS();
  }, 1500);
}

// --- BANCO DE MENSAJES ---
const bancoDeMensajes = [
  { t: "MI MEJOR DECISIÓN", p: "Amarte ha sido la carrera más hermosa de mi vida." },
  { t: "SIN FRENOS", p: "Me enamoré de ti sin frenos y sin marcha atrás." },
  { t: "MI PILOTO FAVORITO", p: "Aceleras mi corazón todos los días." },
  { t: "A TODA VELOCIDAD", p: "Mi corazón late a mil por hora cuando te veo." },
  { t: "MI DESTINO FINAL", p: "No importa la ruta, mi destino siempre eres tú." },

function shuffleArray(array) {
  let currentIndex = array.length, randomIndex;
  while (currentIndex !== 0) {
    randomIndex = Math.floor(Math.random() * currentIndex);
    currentIndex--;
    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
  }
  return array;
}

// --- ESCENA GALAXIA 3D ---
let scene, camera, renderer, controls;
let universoGroup = new THREE.Group();
let carritosInteractivos = [];
let anillosGalaxia = [];
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function initThreeJS() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x020510);
  scene.fog = new THREE.FogExp2(0x020510, 0.00025);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 15000);
  camera.position.set(0, 400, 1600); 

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.getElementById('threeCanvas').appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.8;
  controls.maxDistance = 2500;
  controls.minDistance = 300;

  scene.add(universoGroup);

  crearFondoEstelar();
  crearAgujeroNegroAnimado();
  crearGalaxia();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  
  renderer.domElement.addEventListener('pointerdown', onPointerDown);
  renderer.domElement.addEventListener('pointerup', onPointerUp);

  animate();
}

function crearSpriteTextoFlotante(texto) {
  const canvas = document.createElement('canvas');
  canvas.width = 1024; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.font = '50px "Caveat", cursive, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = '#0055ff'; ctx.shadowBlur = 15;
  ctx.fillText(texto, 512, 64);
  const texture = new THREE.CanvasTexture(canvas);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0.7 }));
  sprite.scale.set(350, 45, 1);
  return sprite;
}

function crearFondoEstelar() {
  const starGeo = new THREE.BufferGeometry(); const starPos = [];
  for(let i=0; i<5000; i++) starPos.push((Math.random()-0.5)*6000, (Math.random()-0.5)*6000, (Math.random()-0.5)*6000);
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xcceeff, size: 2, transparent: true, opacity: 0.6})));
}

function crearAgujeroNegroAnimado() {
  const diskGroup = new THREE.Group();
  const matAnillo = (color, opacidad) => new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide, transparent: true, opacity: opacidad, wireframe: true });

  const ring1 = new THREE.Mesh(new THREE.RingGeometry(180, 260, 64, 4), new THREE.MeshBasicMaterial({color: 0xe0ffff, side: THREE.DoubleSide, transparent: true, opacity: 0.9}));
  const ring2 = new THREE.Mesh(new THREE.RingGeometry(260, 360, 64, 2), matAnillo(0x00aaff, 0.4));
  const ring3 = new THREE.Mesh(new THREE.RingGeometry(360, 550, 64, 1), matAnillo(0x0055ff, 0.15));
  
  anillosGalaxia.push(ring1, ring2, ring3);
  diskGroup.add(ring1, ring2, ring3);
  diskGroup.rotation.x = Math.PI / 2;
  universoGroup.add(diskGroup);
  universoGroup.add(new THREE.Mesh(new THREE.SphereGeometry(175, 32, 32), new THREE.MeshBasicMaterial({ color: 0x000000 })));
}

function crearGalaxia() {
  const loader = new THREE.TextureLoader();
  const texturasAutos = [
    loader.load('auto1.png'), loader.load('auto2.png'), loader.load('auto3.png'),
    loader.load('auto4.png'), loader.load('auto5.png'), loader.load('auto6.png')
  ];

  const frasesFlotantes = ["Acelerando hacia ti", "Contigo la carretera es mejor", "Mi copiloto de vida", "Eres mi persona favorita", "Feliz día para ti", "Mi universo entero", "A toda máquina"];
  const mensajesAleatorios = shuffleArray([...bancoDeMensajes]);

  for(let i=0; i<70; i++) {
    const radio = 450 + Math.random() * 2200;
    const angulo = Math.random() * Math.PI * 2;
    const altura = (Math.random() - 0.5) * 800 * (1 - radio/2800); 
    const spriteTexto = crearSpriteTextoFlotante(frasesFlotantes[Math.floor(Math.random() * frasesFlotantes.length)]);
    spriteTexto.position.set(Math.cos(angulo) * radio, altura, Math.sin(angulo) * radio);
    spriteTexto.userData = { anguloBase: angulo, radio: radio, velocidad: 0.0004 + Math.random() * 0.0008 };
    universoGroup.add(spriteTexto);
  }

  const cantidadAutos = 35; 
  for(let i=0; i<cantidadAutos; i++) {
    const radio = 500 + Math.random() * 1900;
    const angulo = Math.random() * Math.PI * 2;
    const altura = (Math.random() - 0.5) * 450; 
    
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texturasAutos[Math.floor(Math.random() * texturasAutos.length)], transparent: true }));
    sprite.scale.set(200, 100, 1); 
    sprite.position.set(Math.cos(angulo) * radio, altura, Math.sin(angulo) * radio);
    
    sprite.userData = { 
      mensaje: mensajesAleatorios[i], 
      anguloBase: angulo, radio: radio, velocidad: 0.001 + Math.random() * 0.0012 
    };

    carritosInteractivos.push(sprite); 
    universoGroup.add(sprite);
  }
}

let posInicio = { x: 0, y: 0 }, tiempoInicio = 0;
function onPointerDown(e) {
  posInicio.x = e.clientX || (e.touches ? e.touches[0].clientX : 0);
  posInicio.y = e.clientY || (e.touches ? e.touches[0].clientY : 0);
  tiempoInicio = Date.now();
}

function onPointerUp(e) {
  let endX = e.clientX || (e.changedTouches ? e.changedTouches[0].clientX : 0);
  let endY = e.clientY || (e.changedTouches ? e.changedTouches[0].clientY : 0);
  
  if (Math.hypot(endX - posInicio.x, endY - posInicio.y) < 15 && Date.now() - tiempoInicio < 400) {
    mouse.x = (endX / window.innerWidth) * 2 - 1; mouse.y = -(endY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(carritosInteractivos);
    if (intersects.length > 0) {
      const obj = intersects[0].object; 
      abrirModal(obj.userData.mensaje.t, obj.userData.mensaje.p);
      const escX = 200, escY = 100;
      obj.scale.set(escX*1.4, escY*1.4, 1); 
      setTimeout(() => obj.scale.set(escX, escY, 1), 300);
    }
  }
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  universoGroup.rotation.y -= 0.0005;
  if(anillosGalaxia.length === 3) {
    anillosGalaxia[0].rotation.z -= 0.02; anillosGalaxia[1].rotation.z -= 0.008; anillosGalaxia[2].rotation.z -= 0.003;
  }
  universoGroup.children.forEach(c => {
    if(c.userData && c.userData.radio) {
      c.userData.anguloBase += c.userData.velocidad;
      c.position.x = Math.cos(c.userData.anguloBase) * c.userData.radio;
      c.position.z = Math.sin(c.userData.anguloBase) * c.userData.radio;
    }
  });
  renderer.render(scene, camera);
}
