<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz 30 de Septiembre 🏎️✨</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Nunito:wght@400;800&display=swap');

  body { margin: 0; background: #000; overflow: hidden; font-family: 'Nunito', sans-serif; color: white; user-select: none; touch-action: none; }
  
  /* --- PANTALLA DE CARGA --- */
  #pantallaEntrada {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #020510; z-index: 999; display: flex; flex-direction: column;
    align-items: center; justify-content: center; transition: opacity 1s ease;
  }
  
  #textoCarga { font-size: 1.5rem; color: #00d4ff; letter-spacing: 2px; margin-bottom: 20px; animation: parpadeo 1.5s infinite; font-weight: bold; }
  
  .barra-contenedor { width: 80%; max-width: 300px; height: 10px; background: #222; border-radius: 10px; overflow: hidden; position: relative; }
  .barra-progreso { width: 0%; height: 100%; background: linear-gradient(90deg, #0055ff, #00d4ff); transition: width 0.1s linear; }

  #btnDescubrir {
    display: none; padding: 15px 40px; font-size: 1.2rem; font-weight: bold; text-transform: uppercase;
    background: transparent; color: #00d4ff; border: 2px solid #00d4ff; border-radius: 30px;
    cursor: pointer; letter-spacing: 2px; box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
    transition: all 0.3s; margin-top: 30px; animation: latido 2s infinite;
  }
  #btnDescubrir:hover { background: #00d4ff; color: #000; box-shadow: 0 0 30px #00d4ff; }

  @keyframes parpadeo { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  @keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

  /* --- CANVAS Y UI --- */
  #threeCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
  
  #ui-layer {
    position: absolute; top: 20px; width: 100%; text-align: center; z-index: 10; pointer-events: none;
  }
  #ui-layer h1 { 
    margin: 0; font-size: 3rem; color: #fff; 
    text-shadow: 0 0 15px #00aaff, 0 0 30px #0055ff; font-weight: 800; letter-spacing: 2px; 
    font-family: 'Caveat', cursive;
  }
  #instruccion { 
    margin-top: 10px; font-size: 1.1rem; color: #ddd; background: rgba(0, 0, 20, 0.6); 
    display: inline-block; padding: 8px 20px; border-radius: 20px; border: 1px solid #0055ff;
  }

  /* --- TARJETA MODAL --- */
  #modalMensaje {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -45%);
    background: rgba(5, 10, 20, 0.95); border: 2px solid #00aaff; border-radius: 15px;
    width: 85%; max-width: 400px; padding: 30px 20px; text-align: center;
    z-index: 1000; box-shadow: 0 10px 40px rgba(0, 170, 255, 0.5);
    opacity: 0; pointer-events: none; transition: all 0.4s ease; backdrop-filter: blur(8px);
  }
  #modalMensaje.mostrar { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }

  #modalTitulo { font-size: 1.6rem; color: #00d4ff; margin-bottom: 15px; font-weight: 800; font-family: 'Nunito', sans-serif; }
  .modal-car-img { font-size: 3.5rem; margin: 10px 0; display: block; animation: flotar 3s ease-in-out infinite; }
  #modalTexto { font-size: 1.4rem; color: #fff; line-height: 1.4; margin-bottom: 25px; font-family: 'Caveat', cursive; }
  
  .btn-cerrar {
    background: #00aaff; color: #fff; border: none; padding: 12px 35px; border-radius: 25px;
    font-size: 1rem; font-weight: bold; cursor: pointer; box-shadow: 0 0 15px rgba(0, 170, 255, 0.5); transition: 0.2s;
  }
  .btn-cerrar:hover { background: #00d4ff; color: #000; transform: scale(1.1); }

  @keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

  @media (max-width: 768px) { #ui-layer h1 { font-size: 2.2rem; } }
</style>
</head>
<body>

<!-- MÚSICA DE FONDO -->
<audio id="musicaFondo" loop crossorigin="anonymous">
  <source src="cancion.mp3" type="audio/mpeg">
</audio>

<!-- PANTALLA DE CARGA -->
<div id="pantallaEntrada">
  <div id="textoCarga">ENSAMBLANDO UNIVERSO... 0%</div>
  <div class="barra-contenedor">
    <div class="barra-progreso" id="barraProgreso"></div>
  </div>
  <button id="btnDescubrir">EXPLORAR GALAXIA</button>
</div>

<!-- CONTENEDOR 3D -->
<div id="threeCanvas"></div>

<!-- INTERFAZ FLOTANTE -->
<div id="ui-layer">
  <h1>Feliz 30 de Septiembre</h1>
  <div id="instruccion">👆 Arrastra para girar • Toca exactamente un auto para leer</div>
</div>

<!-- TARJETA DE MENSAJE -->
<div id="modalMensaje">
  <div id="modalTitulo">Titulo</div>
  <span class="modal-car-img">🏎️💨</span>
  <div id="modalTexto">Texto</div>
  <button class="btn-cerrar" onclick="cerrarModal()">CONTINUAR</button>
</div>

<!-- LIBRERÍAS THREE.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
// --- 1. LÓGICA DE CARGA ---
let porcentaje = 0;
const textoCarga = document.getElementById('textoCarga');
const barraProgreso = document.getElementById('barraProgreso');
const btnDescubrir = document.getElementById('btnDescubrir');

const intervaloCarga = setInterval(() => {
  porcentaje += Math.floor(Math.random() * 6) + 2;
  if(porcentaje >= 100) {
    porcentaje = 100;
    clearInterval(intervaloCarga);
    textoCarga.innerText = "¡TODO LISTO!";
    barraProgreso.parentElement.style.display = 'none';
    btnDescubrir.style.display = 'block';
  }
  textoCarga.innerText = `ENSAMBLANDO UNIVERSO... ${porcentaje}%`;
  barraProgreso.style.width = `${porcentaje}%`;
}, 100);

btnDescubrir.addEventListener('click', () => {
  document.getElementById('musicaFondo').play().catch(e=>console.log(e));
  document.getElementById('pantallaEntrada').style.opacity = '0';
  setTimeout(() => { document.getElementById('pantallaEntrada').style.display = 'none'; }, 1000);
});

// --- 2. CONFIGURACIÓN DEL UNIVERSO 3D ---
let scene, camera, renderer, controls;
let universoGroup = new THREE.Group();
let carritosInteractivos = []; // Array estricto SOLO para los autos
let anillosGalaxia = []; // Array para animar los anillos de luz
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const textureLoader = new THREE.TextureLoader();

// FRASES ESTILO "TEXTO FLOTANTE" (Decorativas)
const frasesFlotantes = [
  "Acelerando hacia lo que viene", "Contigo la carretera es mejor", "Me alegra conocerte", 
  "Eres mi persona favorita", "Feliz día para ti", "No necesito un motivo para quererte", 
  "Hoy celebro tenerte cerca", "Solo pienso en ti", "Mi copiloto ideal", "Siempre tienes un lugar aquí",
  "Gracias por ser tú", "Contigo todo lugar es bonito", "Mi mundo gira por ti"
];

// FRASES PARA LAS TARJETAS (Al tocar un auto)
const mensajesTarjetas = [
  { t: "Mi mejor decisión", p: "Amarte ha sido la carrera más hermosa de mi vida." },
  { t: "Sin frenos", p: "Me enamoré de ti sin frenos y sin marcha atrás." },
  { t: "Mi piloto favorito", p: "Aceleras mi corazón todos los días." },
  { t: "A toda velocidad", p: "Mi corazón late a mil por hora cuando te veo." },
  { t: "Mi destino final", p: "No importa la ruta, mi destino siempre eres tú." },
  { t: "Hot Wheels", p: "Gracias por dejarme hacer feliz a tu niño interior." },
  { t: "Mi copiloto ideal", p: "La vida es un viaje, gracias por ir a mi lado." },
  { t: "Primera posición", p: "En la carrera de mi vida, tú siempre tienes el primer lugar." },
  { t: "Adrenalina pura", p: "Eso es exactamente lo que siento cuando me miras." },
  { t: "Mi meta", p: "De todos los caminos posibles, siempre te elegiré a ti." },
  { t: "Cero a cien", p: "Me haces pasar de 0 a 100 de felicidad en un segundo." },
  { t: "Motor de mi vida", p: "Tú le das la fuerza y energía a todos mis días." }
];

function init() {
  scene = new THREE.Scene();
  // Fondo azul oscuro infinito
  scene.background = new THREE.Color(0x021024);
  scene.fog = new THREE.FogExp2(0x021024, 0.0002);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 15000);
  camera.position.set(0, 400, 1600); 

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.getElementById('threeCanvas').appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.5;
  controls.maxDistance = 2500;
  controls.minDistance = 300;

  scene.add(universoGroup);

  crearFondoEstelar();
  crearAgujeroNegroAnimado();
  crearGalaxia();

  window.addEventListener('resize', onResize);
  
  // LOGICA DE CLICS
  renderer.domElement.addEventListener('pointerdown', onPointerDown);
  renderer.domElement.addEventListener('pointerup', onPointerUp);
}

function crearSpriteTextoFlotante(texto) {
  const canvas = document.createElement('canvas');
  canvas.width = 1024; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  
  ctx.fillStyle = '#ffffff';
  ctx.font = '50px "Caveat", cursive, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  
  ctx.shadowColor = '#00aaff';
  ctx.shadowBlur = 10;
  ctx.fillText(texto, 512, 64);
  
  const texture = new THREE.CanvasTexture(canvas);
  const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0.8 });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.set(400, 50, 1);
  return sprite;
}

function crearFondoEstelar() {
  const starGeo = new THREE.BufferGeometry(); const starPos = [];
  for(let i=0; i<4000; i++) starPos.push((Math.random()-0.5)*6000, (Math.random()-0.5)*6000, (Math.random()-0.5)*6000);
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xcceeff, size: 2, transparent: true, opacity: 0.6})));
}

function crearAgujeroNegroAnimado() {
  const diskGroup = new THREE.Group();
  
  // Para que se note la rotación, usamos un mapa de textura básico a rayas o segmentos
  // (Si usamos color sólido, al girar no se nota). Vamos a mapear la opacidad.
  
  const materialAnillo = (colorHex, opacidad) => {
    return new THREE.MeshBasicMaterial({
      color: colorHex, 
      side: THREE.DoubleSide, 
      transparent: true, 
      opacity: opacidad,
      wireframe: true // Usar wireframe leve hace que al girar se vea increíble y de alta tecnología
    });
  };

  const ring1 = new THREE.Mesh(new THREE.RingGeometry(160, 240, 64, 4), new THREE.MeshBasicMaterial({color: 0xe0ffff, side: THREE.DoubleSide, transparent: true, opacity: 0.9}));
  const ring2 = new THREE.Mesh(new THREE.RingGeometry(240, 340, 64, 2), materialAnillo(0x00aaff, 0.4));
  const ring3 = new THREE.Mesh(new THREE.RingGeometry(340, 500, 64, 1), materialAnillo(0x0055ff, 0.2));
  
  // Guardamos en el array global para rotarlos en animate()
  anillosGalaxia.push(ring1, ring2, ring3);

  diskGroup.add(ring1, ring2, ring3);
  diskGroup.rotation.x = Math.PI / 2;
  universoGroup.add(diskGroup);

  // Esfera negra central (El núcleo)
  const bhGeo = new THREE.SphereGeometry(158, 32, 32);
  const bhMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
  universoGroup.add(new THREE.Mesh(bhGeo, bhMat));
}

function crearGalaxia() {
  // CARGAR LAS IMÁGENES PNG EXACTAS QUE PONGAS EN TU CARPETA
  const texturasAutos = [
    textureLoader.load('auto1.png'),
    textureLoader.load('auto2.png'),
    textureLoader.load('auto3.png'),
    textureLoader.load('auto4.png')
  ];

  // 1. Generar Textos Flotantes (No interactivos)
  for(let i=0; i<80; i++) {
    const radio = 400 + Math.random() * 2000;
    const angulo = Math.random() * Math.PI * 2;
    const altura = (Math.random() - 0.5) * 800 * (1 - radio/2500); 
    
    const frase = frasesFlotantes[Math.floor(Math.random() * frasesFlotantes.length)];
    const spriteTexto = crearSpriteTextoFlotante(frase);
    
    spriteTexto.position.set(Math.cos(angulo) * radio, altura, Math.sin(angulo) * radio);
    spriteTexto.userData = { anguloBase: angulo, radio: radio, velocidad: 0.0005 + Math.random() * 0.001 };
    universoGroup.add(spriteTexto);
  }

  // 2. Generar Carritos Hot Wheels Interactivos (PNGs)
  for(let i=0; i<40; i++) {
    const radio = 450 + Math.random() * 1800;
    const angulo = Math.random() * Math.PI * 2;
    const altura = (Math.random() - 0.5) * 400; 
    
    const texturaRandom = texturasAutos[Math.floor(Math.random() * texturasAutos.length)];
    
    // Usamos el Sprite directamente (sin hitbox secundaria) para una colisión perfecta
    const spriteMat = new THREE.SpriteMaterial({ map: texturaRandom, transparent: true });
    const carrito = new THREE.Sprite(spriteMat);
    carrito.scale.set(220, 110, 1); 

    const fraseElegida = mensajesTarjetas[Math.floor(Math.random() * mensajesTarjetas.length)];
    
    carrito.position.set(Math.cos(angulo) * radio, altura, Math.sin(angulo) * radio);
    carrito.userData = { 
      mensaje: fraseElegida,
      anguloBase: angulo, 
      radio: radio, 
      velocidad: 0.001 + Math.random() * 0.0015 
    };

    // ALMACENAMOS EL SPRITE DIRECTAMENTE PARA QUE EL RAYCASTER SEA 100% PRECISO
    carritosInteractivos.push(carrito); 
    universoGroup.add(carrito);
  }
}

// --- 3. LÓGICA DE CLICS EXACTA Y MILIMÉTRICA ---
let posInicio = { x: 0, y: 0 };
let tiempoInicio = 0;

function onPointerDown(event) {
  posInicio.x = event.clientX || (event.touches ? event.touches[0].clientX : 0);
  posInicio.y = event.clientY || (event.touches ? event.touches[0].clientY : 0);
  tiempoInicio = Date.now();
}

function onPointerUp(event) {
  let endX = event.clientX || (event.changedTouches ? event.changedTouches[0].clientX : 0);
  let endY = event.clientY || (event.changedTouches ? event.changedTouches[0].clientY : 0);
  
  let distancia = Math.hypot(endX - posInicio.x, endY - posInicio.y);
  let tiempo = Date.now() - tiempoInicio;
  
  // Es un clic si el dedo casi no se movió y fue rápido
  if (distancia < 15 && tiempo < 400) {
    mouse.x = (endX / window.innerWidth) * 2 - 1;
    mouse.y = -(endY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    
    // VERIFICACIÓN EXACTA: Solo detecta los píxeles reales de las imágenes de los carritos
    const intersects = raycaster.intersectObjects(carritosInteractivos);

    if (intersects.length > 0) {
      // Tomamos el primer carrito que intercepta el rayo
      const carritoTocado = intersects[0].object; 
      mostrarModal(carritoTocado.userData.mensaje);
      
      // Animación de latido en la imagen del auto
      const escalaOrgX = 220;
      const escalaOrgY = 110;
      carritoTocado.scale.set(escalaOrgX*1.3, escalaOrgY*1.3, 1);
      setTimeout(() => { carritoTocado.scale.set(escalaOrgX, escalaOrgY, 1); }, 300);
    }
  }
}

function mostrarModal(datos) {
  document.getElementById('modalTitulo').innerText = datos.t;
  document.getElementById('modalTexto').innerText = datos.p;
  document.getElementById('modalMensaje').classList.add('mostrar');
}

function cerrarModal() {
  document.getElementById('modalMensaje').classList.remove('mostrar');
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// --- LOOP DE ANIMACIÓN ---
function animate() {
  requestAnimationFrame(animate);
  controls.update();

  // Rotar toda la galaxia lentamente
  universoGroup.rotation.y -= 0.0005;

  // ANIMAR LOS ANILLOS DE LA GALAXIA INDIVIDUALMENTE (Efecto realista)
  if(anillosGalaxia.length === 3) {
    anillosGalaxia[0].rotation.z -= 0.02;   // Anillo interno muy rápido
    anillosGalaxia[1].rotation.z -= 0.008;  // Anillo medio moderado
    anillosGalaxia[2].rotation.z -= 0.003;  // Anillo externo lento
  }

  // Rotar carritos y textos en su órbita
  universoGroup.children.forEach(child => {
    if(child.userData && child.userData.radio) {
      child.userData.anguloBase += child.userData.velocidad;
      child.position.x = Math.cos(child.userData.anguloBase) * child.userData.radio;
      child.position.z = Math.sin(child.userData.anguloBase) * child.userData.radio;
    }
  });

  renderer.render(scene, camera);
}

init();
animate();
</script>
</body>
</html>
