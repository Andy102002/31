<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Día de los Hot Wheels 🏎️✨</title>
<style>
  body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; user-select: none; touch-action: none; }
  
  /* --- PANTALLA DE CARGA Y ENTRADA --- */
  #pantallaEntrada {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #020205; z-index: 999; display: flex; flex-direction: column;
    align-items: center; justify-content: center; transition: opacity 1s ease;
  }
  
  #textoCarga { font-size: 1.2rem; color: #00d4ff; letter-spacing: 2px; margin-bottom: 20px; animation: parpadeo 1.5s infinite; }
  
  .barra-contenedor { width: 80%; max-width: 300px; height: 10px; background: #222; border-radius: 10px; overflow: hidden; position: relative; }
  .barra-progreso { width: 0%; height: 100%; background: linear-gradient(90deg, #ff0055, #ffaa00, #00d4ff); transition: width 0.1s linear; }

  #btnDescubrir {
    display: none; padding: 15px 40px; font-size: 1.2rem; font-weight: bold; text-transform: uppercase;
    background: transparent; color: #00d4ff; border: 2px solid #00d4ff; border-radius: 30px;
    cursor: pointer; letter-spacing: 2px; box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
    transition: all 0.3s; margin-top: 30px; animation: latido 2s infinite;
  }
  #btnDescubrir:hover { background: #00d4ff; color: #000; box-shadow: 0 0 30px #00d4ff; }

  @keyframes parpadeo { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  @keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

  /* --- CANVAS Y UI FLOTANTE --- */
  #threeCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
  
  #ui-layer {
    position: absolute; top: 20px; width: 100%; text-align: center; z-index: 10; pointer-events: none;
  }
  #ui-layer h1 { margin: 0; font-size: 1.8rem; color: #fff; text-shadow: 0 0 10px #00d4ff, 0 0 20px #00d4ff; font-weight: 300; letter-spacing: 1px; }
  #ui-layer p { margin: 5px 0 0 0; font-size: 0.9rem; color: #ccc; }

  /* --- MODAL ESTILO TIKTOK --- */
  #modalMensaje {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -45%);
    background: rgba(10, 15, 25, 0.95); border: 1px solid #00d4ff; border-radius: 15px;
    width: 85%; max-width: 400px; padding: 30px 20px; text-align: center;
    z-index: 1000; box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
    opacity: 0; pointer-events: none; transition: all 0.4s ease; backdrop-filter: blur(5px);
  }
  #modalMensaje.mostrar { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }

  #modalTitulo { font-size: 1.4rem; color: #ffaa00; margin-bottom: 20px; font-weight: bold; }
  .modal-car-img { font-size: 4rem; text-shadow: 0 0 20px #ff0055; margin: 15px 0; display: block; animation: flotar 3s ease-in-out infinite; }
  #modalTexto { font-size: 1rem; color: #e0e0e0; line-height: 1.5; margin-bottom: 25px; }
  
  .btn-cerrar {
    background: #00d4ff; color: #000; border: none; padding: 10px 30px; border-radius: 20px;
    font-size: 1rem; font-weight: bold; cursor: pointer; box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
  }

  @keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

  @media (max-width: 768px) { #ui-layer h1 { font-size: 1.4rem; } }
</style>
</head>
<body>

<!-- MÚSICA DE FONDO (Con el nombre exacto que pediste) -->
<audio id="musicaFondo" loop crossorigin="anonymous">
  <source src="cancion.mp3" type="audio/mpeg">
</audio>

<!-- PANTALLA DE CARGA -->
<div id="pantallaEntrada">
  <div id="textoCarga">PREPARANDO TU UNIVERSO... 0%</div>
  <div class="barra-contenedor">
    <div class="barra-progreso" id="barraProgreso"></div>
  </div>
  <button id="btnDescubrir">DESCUBRIR</button>
</div>

<!-- CONTENEDOR 3D -->
<div id="threeCanvas"></div>

<!-- INTERFAZ -->
<div id="ui-layer">
  <h1>Feliz Día de los Hot Wheels</h1>
  <p>PARA ALGUIEN MUY ESPECIAL ✨</p>
  <p style="color: #ffaa00; font-size: 0.8rem; margin-top:10px;">(Gira el universo y toca los carritos)</p>
</div>

<!-- TARJETA MODAL -->
<div id="modalMensaje">
  <div id="modalTitulo">Amarte es mi mejor decisión</div>
  <span class="modal-car-img">🏎️💨</span>
  <div id="modalTexto">Gracias por existir en mi vida y acelerar mi corazón todos los días.</div>
  <button class="btn-cerrar" onclick="cerrarModal()">SEGUIR EXPLORANDO</button>
</div>

<!-- LIBRERÍAS THREE.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
// --- 1. LÓGICA DE CARGA ---
let porcentaje = 0;
const textoCarga = document.getElementById('textoCarga');
const barraProgreso = document.getElementById('barraProgreso');
const btnDescubrir = document.getElementById('btnDescubrir');

const intervaloCarga = setInterval(() => {
  porcentaje += Math.floor(Math.random() * 5) + 1;
  if(porcentaje >= 100) {
    porcentaje = 100;
    clearInterval(intervaloCarga);
    textoCarga.innerText = "FELIZ DÍA DE LOS HOT WHEELS";
    textoCarga.style.color = "#ffaa00";
    barraProgreso.parentElement.style.display = 'none';
    btnDescubrir.style.display = 'block';
  }
  textoCarga.innerText = `PREPARANDO TU UNIVERSO... ${porcentaje}%`;
  barraProgreso.style.width = `${porcentaje}%`;
}, 100);

btnDescubrir.addEventListener('click', () => {
  document.getElementById('musicaFondo').play().catch(e=>console.log(e));
  document.getElementById('pantallaEntrada').style.opacity = '0';
  setTimeout(() => { document.getElementById('pantallaEntrada').style.display = 'none'; }, 1000);
});

// --- 2. CONFIGURACIÓN DEL UNIVERSO 3D ---
let scene, camera, renderer, controls;
let universoGroup = new THREE.Group();
let carritosInteractivos = [];
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

const palabras = ["Amor", "Destino", "Mi paz", "Rayo", "Universo", "Confianza", "Brillamos", "Meta", "Velocidad", "Sueños", "Mi noche", "Único"];
const mensajesRomanticos = [
  { titulo: "Amarte es mi mejor decisión", texto: "Gracias por existir en mi vida. Eres mi pista favorita." },
  { titulo: "Contigo todo tiene sentido", texto: "Tu amor es mi lugar favorito. Aceleras mi mundo." },
  { titulo: "Eres mi piloto favorito", texto: "No hay límite de velocidad para lo que siento por ti." },
  { titulo: "Mi universo entero", texto: "Cada momento a tu lado es una carrera que no quiero que termine." }
];

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x020205);
  scene.fog = new THREE.FogExp2(0x020205, 0.0003);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 10000);
  camera.position.set(0, 500, 1800); 

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.getElementById('threeCanvas').appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.5;
  controls.maxDistance = 3000;
  controls.minDistance = 500;

  scene.add(universoGroup);

  crearFondoEstelar();
  crearAgujeroNegro();
  crearGalaxiaDePalabrasYCarros();

  window.addEventListener('resize', onResize);
  
  // EVENTOS ARREGLADOS: Detectar si es arrastre o clic
  renderer.domElement.addEventListener('pointerdown', onPointerDown);
  renderer.domElement.addEventListener('pointerup', onPointerUp);
}

// TEXTOS FLOTANTES
function crearSpriteTexto(texto, colorHex) {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = colorHex;
  ctx.font = 'bold 45px "Segoe UI", Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = colorHex;
  ctx.shadowBlur = 15;
  ctx.fillText(texto, 256, 64);
  const texture = new THREE.CanvasTexture(canvas);
  const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, blending: THREE.AdditiveBlending });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.set(300, 75, 1);
  return sprite;
}

// DISEÑO 1: CARRITO NEÓN (El que ya te había gustado)
function crearSpriteCarritoNeon(colorHex) {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  
  ctx.shadowColor = colorHex; ctx.shadowBlur = 15;
  ctx.strokeStyle = colorHex; ctx.lineWidth = 6; ctx.lineCap = 'round';
  
  ctx.beginPath();
  ctx.moveTo(40, 80); ctx.lineTo(80, 80); 
  ctx.lineTo(110, 40); ctx.lineTo(180, 40); 
  ctx.lineTo(210, 60); ctx.lineTo(230, 80); 
  ctx.lineTo(230, 100); ctx.lineTo(40, 100); 
  ctx.closePath(); ctx.stroke();
  
  ctx.beginPath(); ctx.arc(80, 100, 15, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(190, 100, 15, 0, Math.PI*2); ctx.stroke();

  const texture = new THREE.CanvasTexture(canvas);
  const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, blending: THREE.AdditiveBlending });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.set(150, 75, 1);
  return sprite;
}

// DISEÑO 2: CARRITO DETALLADO CON LOGO HOT WHEELS
function crearSpriteCarritoLogo(colorCarro) {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  
  // Cuerpo sólido del auto estilo deportivo agresivo
  ctx.fillStyle = colorCarro;
  ctx.beginPath();
  ctx.moveTo(20, 95); ctx.lineTo(20, 70); 
  ctx.lineTo(60, 60); // Alerón trasero
  ctx.lineTo(100, 35); // Techo trasero
  ctx.lineTo(160, 35); // Techo
  ctx.lineTo(210, 60); // Parabrisas
  ctx.lineTo(240, 80); // Trompa baja
  ctx.lineTo(240, 95); // Frente inferior
  ctx.closePath();
  ctx.fill();

  // Ventanas (vidrios oscuros)
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.beginPath(); 
  ctx.moveTo(105, 38); ctx.lineTo(155, 38); 
  ctx.lineTo(195, 60); ctx.lineTo(95, 60); 
  ctx.fill();

  // LOGO HOT WHEELS (Flama roja y letras amarillas)
  ctx.fillStyle = '#e60000'; // Rojo clásico
  ctx.beginPath();
  ctx.ellipse(130, 77, 35, 12, 0, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#ffcc00'; // Amarillo clásico
  ctx.font = 'italic bold 14px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('HOT WHEELS', 130, 78);

  // Ruedas detalladas
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(65, 95, 18, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(195, 95, 18, 0, Math.PI*2); ctx.fill();
  
  // Rines
  ctx.fillStyle = '#ddd';
  ctx.beginPath(); ctx.arc(65, 95, 8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(195, 95, 8, 0, Math.PI*2); ctx.fill();

  const texture = new THREE.CanvasTexture(canvas);
  // Aquí usamos un material opaco normal para que se vea sólido y no transparente
  const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.set(160, 80, 1);
  return sprite;
}

function crearFondoEstelar() {
  const starGeo = new THREE.BufferGeometry();
  const starPos = [];
  for(let i=0; i<3000; i++) {
    starPos.push((Math.random()-0.5)*5000, (Math.random()-0.5)*5000, (Math.random()-0.5)*5000);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
  const starMat = new THREE.PointsMaterial({color: 0xffffff, size: 2, transparent: true, opacity: 0.5});
  scene.add(new THREE.Points(starGeo, starMat));
}

function crearAgujeroNegro() {
  const ringGeo = new THREE.RingGeometry(150, 200, 64);
  const ringMat = new THREE.MeshBasicMaterial({ color: 0x0055ff, side: THREE.DoubleSide, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2;
  universoGroup.add(ring);
  
  const sphereGeo = new THREE.SphereGeometry(145, 32, 32);
  const sphereMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
  universoGroup.add(new THREE.Mesh(sphereGeo, sphereMat));
}

function crearGalaxiaDePalabrasYCarros() {
  const colores = ['#00d4ff', '#ff0055', '#ffaa00', '#00ff88'];
  // Colores para los autos sólidos (naranja Lambo, azul, rojo oscuro, blanco)
  const coloresSolidos = ['#ff6600', '#0055ff', '#cc0000', '#ffffff'];
  
  for(let i=0; i<150; i++) {
    const radio = 300 + Math.random() * 1500;
    const angulo = Math.random() * Math.PI * 2;
    const altura = (Math.random() - 0.5) * 600 * (1 - radio/2000); 
    
    const x = Math.cos(angulo) * radio;
    const y = altura;
    const z = Math.sin(angulo) * radio;

    let elemento;
    
    if (Math.random() > 0.35) {
      // 65% de probabilidad de ser una palabra
      const palabraRandom = palabras[Math.floor(Math.random() * palabras.length)];
      const colorRandom = colores[Math.floor(Math.random() * colores.length)];
      elemento = crearSpriteTexto(palabraRandom, colorRandom);
    } else {
      // 35% de probabilidad de ser un carrito
      // Mezclar 50/50 entre diseño Neón y diseño Sólido con Logo
      if (Math.random() > 0.5) {
         const colorRandom = colores[Math.floor(Math.random() * colores.length)];
         elemento = crearSpriteCarritoNeon(colorRandom);
      } else {
         const colorSolido = coloresSolidos[Math.floor(Math.random() * coloresSolidos.length)];
         elemento = crearSpriteCarritoLogo(colorSolido);
      }
      
      const hitBoxGeo = new THREE.SphereGeometry(60, 8, 8);
      const hitBoxMat = new THREE.MeshBasicMaterial({visible: false});
      const hitbox = new THREE.Mesh(hitBoxGeo, hitBoxMat);
      elemento.add(hitbox);
      
      elemento.userData = { 
        esCarrito: true, 
        mensaje: mensajesRomanticos[Math.floor(Math.random() * mensajesRomanticos.length)] 
      };
      carritosInteractivos.push(hitbox); 
    }

    elemento.position.set(x, y, z);
    elemento.userData.anguloBase = angulo;
    elemento.userData.radio = radio;
    elemento.userData.velocidad = 0.001 + Math.random() * 0.002;
    
    universoGroup.add(elemento);
  }
}

// --- 3. LÓGICA DE CLICS (ARREGLADA PARA NO CONFUNDIR ARRASTRE CON CLIC) ---
let posInicioClic = { x: 0, y: 0 };

function onPointerDown(event) {
  posInicioClic.x = event.clientX || (event.touches ? event.touches[0].clientX : 0);
  posInicioClic.y = event.clientY || (event.touches ? event.touches[0].clientY : 0);
}

function onPointerUp(event) {
  let endX = event.clientX || (event.changedTouches ? event.changedTouches[0].clientX : 0);
  let endY = event.clientY || (event.changedTouches ? event.changedTouches[0].clientY : 0);
  
  // Calculamos la distancia que se movió el dedo/mouse
  let distancia = Math.hypot(endX - posInicioClic.x, endY - posInicioClic.y);
  
  // Si se movió menos de 10 píxeles, es un CLIC. Si es mayor, es que estaba girando la cámara.
  if (distancia < 10) {
    mouse.x = (endX / window.innerWidth) * 2 - 1;
    mouse.y = -(endY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(carritosInteractivos);

    if (intersects.length > 0) {
      const carritoTocado = intersects[0].object.parent; 
      mostrarModal(carritoTocado.userData.mensaje);
      
      // Animación de latido al tocar el carrito
      carritoTocado.scale.set(220, 110, 1);
      setTimeout(() => { carritoTocado.scale.set(160, 80, 1); }, 400);
    }
  }
}

function mostrarModal(datos) {
  document.getElementById('modalTitulo').innerText = datos.titulo;
  document.getElementById('modalTexto').innerText = datos.texto;
  document.getElementById('modalMensaje').classList.add('mostrar');
}

function cerrarModal() {
  document.getElementById('modalMensaje').classList.remove('mostrar');
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// --- LOOP DE ANIMACIÓN ---
function animate() {
  requestAnimationFrame(animate);
  controls.update();

  universoGroup.rotation.y -= 0.001;

  universoGroup.children.forEach(child => {
    if(child.userData.radio) {
      child.userData.anguloBase += child.userData.velocidad;
      child.position.x = Math.cos(child.userData.anguloBase) * child.userData.radio;
      child.position.z = Math.sin(child.userData.anguloBase) * child.userData.radio;
    }
  });

  renderer.render(scene, camera);
}

init();
animate();
</script>
</body>
</html>
