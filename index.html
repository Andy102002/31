<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sorpresa Especial 💙</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Nunito:wght@800&display=swap');

  :root {
    --bg-dark: #0b1021; --primary-blue: #0055ff; --neon-blue: #00d4ff;
  }

  * { box-sizing: border-box; }
  body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg-dark); overflow: hidden; font-family: 'Nunito', sans-serif; color: white; user-select: none; touch-action: none; }
  
  #pantallaEntrada { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transition: opacity 1s ease; }
  #textoCarga { font-size: 1.5rem; color: var(--neon-blue); letter-spacing: 2px; margin-bottom: 20px; animation: parpadeo 1.5s infinite; font-weight: bold; text-transform: uppercase; }
  .barra-contenedor { width: 80%; max-width: 350px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin: 0 auto; }
  .barra-progreso { width: 0%; height: 100%; background: linear-gradient(90deg, var(--primary-blue), var(--neon-blue)); transition: width 0.1s linear; }

  #btnDescubrir { display: none; padding: 15px 50px; font-size: 1.2rem; font-weight: 900; background: transparent; color: var(--neon-blue); border: 2px solid var(--neon-blue); border-radius: 30px; cursor: pointer; letter-spacing: 2px; box-shadow: 0 0 20px rgba(0, 212, 255, 0.4); margin-top: 40px; animation: latido 2s infinite; }
  
  #escenaRamo { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #111a3a 0%, var(--bg-dark) 100%); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 1.5s ease; }
  .ramo-titulo { font-family: 'Caveat', cursive; font-size: clamp(2.2rem, 5.5vw, 4.5rem); color: #fff; text-shadow: 0 0 15px var(--primary-blue), 0 0 30px var(--neon-blue); opacity: 0; animation: fadeIn 1.5s forwards 0.2s; text-align: center; z-index: 200; margin-top: -50px; }
  .ramo-master { position: relative; width: 420px; height: 500px; display: flex; justify-content: center; align-items: flex-end; opacity: 0; animation: nacerRamoMaster 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 0.5s; transform-origin: bottom center; }

  @keyframes nacerRamoMaster { 0% { transform: translateY(250px) scale(0.2); opacity: 0; } 100% { transform: translateY(-40px) scale(1.3); opacity: 1; } }
  @media (max-width: 600px) { @keyframes nacerRamoMaster { 0% { transform: translateY(250px) scale(0.2); opacity: 0; } 100% { transform: translateY(-30px) scale(1.05); opacity: 1; } } }

  .capa-fondo { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; background-image: url('ramo_atras.png'); background-size: contain; background-position: bottom center; background-repeat: no-repeat; z-index: 10; }
  .capa-frente { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; background-image: url('ramo_frente.png'); background-size: contain; background-position: bottom center; background-repeat: no-repeat; z-index: 20; pointer-events: none; }
  
  .cajas-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; }
  
  /* Botón Galaxia */
  #btnGalaxia { position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%); width: 240px; height: 60px; background: linear-gradient(45deg, #020024, #4a00e0, #8e2de2, #00d4ff, #020024); background-size: 300% 300%; border: 2px solid #00d4ff; border-radius: 30px; color: #fff; font-weight: 900; font-size: 1.4rem; letter-spacing: 4px; cursor: pointer; opacity: 0; box-shadow: 0 0 25px #00d4ff; display: flex; align-items: center; justify-content: center; z-index: 50; animation: nacerBoton 1s forwards 3.5s, fondoGalaxia 4s ease infinite; }
  
  /* Canvas ThreeJS */
  #threeCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: none; }
  #ui-galaxia { position: absolute; top: 30px; width: 100%; text-align: center; z-index: 10; display: none; pointer-events: none; }
  #ui-galaxia h1 { margin: 0; font-size: clamp(2.2rem, 5vw, 4.5rem); color: #fff; text-shadow: 0 0 20px #ff0055, 0 0 40px var(--neon-blue); font-weight: 800; font-family: 'Caveat', cursive; }
  
  /* Modal */
  #modalMensaje { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -45%) scale(0.9); background: rgba(255, 255, 255, 0.98); border: 4px solid var(--primary-blue); border-radius: 20px; width: 85%; max-width: 380px; padding: 35px 25px; text-align: center; color: #111; z-index: 10000; box-shadow: 0 20px 60px rgba(0,0,0,0.8); opacity: 0; pointer-events: none; transition: 0.4s; }
  #modalMensaje.mostrar { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
  #modalTitulo { font-size: 1.6rem; color: var(--primary-blue); margin-bottom: 10px; font-weight: 900; }
  .modal-img-tierna { font-size: 4.5rem; margin: 15px 0; display: block; animation: flotar 3s ease-in-out infinite; }
  #modalTexto { font-size: 1.4rem; line-height: 1.4; margin-bottom: 30px; font-weight: 700; font-family: 'Caveat', cursive; }
  .btn-cerrar { background: var(--primary-blue); color: #fff; border: none; padding: 12px 40px; border-radius: 30px; font-size: 1.1rem; font-weight: 900; cursor: pointer; }

  /* MODO CREADOR (NUEVO) */
  #btnAbrirCreador { position: fixed; bottom: 15px; right: 15px; z-index: 25000; background: rgba(0,212,255,0.2); border: 1px solid var(--neon-blue); color: var(--neon-blue); padding: 8px 15px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; font-weight: bold; }
  #panelCreacion { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,8,20,0.98); z-index: 30000; display: none; flex-direction: column; align-items: center; overflow-y: auto; padding: 30px 20px; }
  .form-box { background: rgba(255,255,255,0.05); border: 1px solid var(--neon-blue); border-radius: 15px; padding: 25px; width: 100%; max-width: 500px; }
  .form-box h2 { color: var(--neon-blue); font-family: 'Caveat', cursive; font-size: 2rem; margin-top: 0; text-align: center; }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-size: 0.9rem; margin-bottom: 5px; font-weight: bold; }
  .form-group input, .form-group textarea { width: 100%; padding: 10px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: #fff; font-family: 'Nunito', sans-serif; }
  .btn-crear { background: linear-gradient(90deg, var(--primary-blue), var(--neon-blue)); border: none; padding: 12px; width: 100%; color: #fff; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; }

  /* Animaciones y utilidades de las cartas (Sacadas de tu código) */
  .blister-card { --rot: 0deg; position: absolute; width: 85px; height: 130px; pointer-events: auto; background: linear-gradient(180deg, #0a1f44 0%, #020617 100%); border-radius: 8px 8px 5px 5px; border: 2px solid rgba(100, 180, 255, 0.7); display: flex; flex-direction: column; align-items: center; cursor: pointer; opacity: 0; transform-origin: bottom center; transform: rotate(var(--rot)); transition: 0.3s; }
  .blister-card:hover { transform: translateY(-20px) scale(1.3) rotate(var(--rot)) !important; z-index: 100 !important; filter: brightness(1.2); }
  .blister-hueco { width: 25px; height: 8px; background: var(--bg-dark); border-radius: 0 0 10px 10px; border: 1px solid rgba(255,255,255,0.4); border-top: none; margin-bottom: 5px; }
  .blister-logo { background: #e60000; color: #ffcc00; font-size: 0.5rem; font-weight: 900; font-style: italic; padding: 2px 8px; border-radius: 12px; border: 1px solid #fff; margin-top: 6px; margin-bottom: auto; }
  .blister-burbuja { width: 85%; height: 70px; background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.02) 100%); border-radius: 10px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.4); display: flex; justify-content: center; align-items: center; overflow: hidden; }
  .blister-auto-img { width: 90%; height: auto; max-height: 55px; object-fit: contain; }
  
  @keyframes saltarAuto { 0% { transform: translateY(150px) scale(0) rotate(var(--rot)); opacity: 0; } 70% { transform: translateY(-10px) scale(1.1) rotate(var(--rot)); opacity: 1; } 100% { transform: translateY(0) scale(1) rotate(var(--rot)); opacity: 1; } }
  @keyframes parpadeo { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
  @keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes fondoGalaxia { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  @keyframes nacerBoton { 0% { transform: translateX(-50%) scale(0); opacity: 0; } 100% { transform: translateX(-50%) scale(1); opacity: 1; } }
</style>
</head>
<body>

<audio id="musicaFondo" loop crossorigin="anonymous"><source src="cancion.mp3" type="audio/mpeg"></audio>

<!-- BOTÓN PARA CREAR -->
<button id="btnAbrirCreador">✨ Crear tu propio ramo</button>

<!-- PANEL CREADOR -->
<div id="panelCreacion">
  <div class="form-box">
    <h2>Personaliza tu Regalo</h2>
    <div class="form-group">
      <label>Título (ej. Feliz 30 de Septiembre):</label>
      <input type="text" id="inputTitulo" value="Feliz 30 de Septiembre">
    </div>
    <div class="form-group">
      <label>Mensaje secreto de la carta central:</label>
      <textarea id="inputMsgCentral">Aceleras mi mundo en cada kilómetro recorrido 🏎️</textarea>
    </div>
    <div class="form-group">
      <label>Sube una foto para el centro (Opcional):</label>
      <input type="file" id="inputFoto" accept="image/*">
      <p style="font-size:0.8rem; color:#aaa;">(Si no subes nada, quedará el auto normal).</p>
    </div>
    <button class="btn-crear" id="btnGenerarEnlace">Generar Enlace Mágico</button>
    <div id="resultadoEnlace" style="margin-top: 15px; word-break: break-all; font-size: 0.9rem; color: var(--neon-blue); text-align: center;"></div>
  </div>
  <button id="btnCerrarCreador" style="background:none; border:none; color:#aaa; cursor:pointer; margin-top:15px;">Cerrar panel</button>
</div>

<!-- PANTALLAS DEL REGALO -->
<div id="pantallaEntrada">
  <div id="textoCarga">ENSAMBLANDO SORPRESA... 0%</div>
  <div class="barra-contenedor"><div class="barra-progreso" id="barraProgreso"></div></div>
  <button id="btnDescubrir">ABRIR REGALO</button>
</div>

<div id="escenaRamo">
  <div class="ramo-titulo" id="tituloDinamico">💙 Feliz 30 de Septiembre 💙</div>
  <div class="ramo-master">
    <div class="capa-fondo"></div>
    <div class="cajas-container" id="contenedorCartas">
      <!-- Las cartas se inyectan desde JavaScript -->
    </div>
    <div class="capa-frente"></div>
    <button id="btnGalaxia">GALAXIA</button>
  </div>
</div>

<div id="threeCanvas"></div>
<div id="ui-galaxia"><h1 id="tituloGalaxia">💙 Feliz 30 de Septiembre 💙</h1></div>

<div id="modalMensaje">
  <div id="modalTitulo">Titulo</div>
  <span class="modal-img-tierna">🐻❤️🐼</span>
  <div id="modalTexto">Texto</div>
  <button class="btn-cerrar" id="btnCerrarModal">CONTINUAR</button>
</div>

<!-- LIBRERÍAS DE THREE.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<!-- TU SCRIPT PROTEGIDO -->
<script type="module" src="script.js"></script>
</body>
</html>
