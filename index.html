<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Día de los Hot Wheels 🏎️✨</title>
<style>
  body { margin: 0; background: #000; overflow: hidden; font-family: 'Georgia', serif; color: white; user-select: none; }
  
  /* --- PANTALLA DE CARGA --- */
  #pantallaEntrada {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #020205; z-index: 999; display: flex; flex-direction: column;
    align-items: center; justify-content: center; transition: opacity 1s ease;
  }
  
  .logo-carga { width: 150px; margin-bottom: 20px; animation: flotar 2s infinite ease-in-out; }
  #textoCarga { font-size: 1.2rem; color: #ffaa00; letter-spacing: 2px; margin-bottom: 20px; font-family: 'Courier New', Courier, monospace; }
  
  .barra-contenedor { width: 80%; max-width: 300px; height: 8px; background: #222; border-radius: 10px; overflow: hidden; position: relative; }
  .barra-progreso { width: 0%; height: 100%; background: linear-gradient(90deg, #ff0055, #ffaa00); transition: width 0.1s linear; }

  #btnDescubrir {
    display: none; padding: 12px 35px; font-size: 1.2rem; font-weight: bold; text-transform: uppercase;
    background: transparent; color: #ffaa00; border: 2px solid #ffaa00; border-radius: 30px;
    cursor: pointer; letter-spacing: 2px; box-shadow: 0 0 15px rgba(255, 170, 0, 0.4);
    transition: all 0.3s; margin-top: 30px; animation: latido 2s infinite; font-family: 'Courier New', Courier, monospace;
  }
  #btnDescubrir:hover { background: #ffaa00; color: #000; box-shadow: 0 0 30px #ffaa00; }

  /* --- CANVAS Y UI ESTILO VIDEO --- */
  #threeCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
  
  #ui-layer {
    position: absolute; top: 30px; width: 100%; text-align: center; z-index: 10; pointer-events: none;
  }
  #ui-layer h1 { 
    margin: 0; font-size: 2.2rem; color: #ffcc00; 
    text-shadow: 0 0 10px #ff5500, 2px 2px 5px #000; font-weight: bold; font-style: italic;
  }
  #ui-layer p { 
    margin: 5px 0 0 0; font-size: 1.4rem; color: #fff; font-style: italic;
    text-shadow: 0 0 10px #ffaa00; font-family: 'Dancing Script', cursive, serif;
  }

  /* --- MODAL ESTILO TIKTOK --- */
  #modalMensaje {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -45%);
    background: rgba(10, 15, 25, 0.95); border: 1px solid #00d4ff; border-radius: 15px;
    width: 85%; max-width: 380px; padding: 30px 20px; text-align: center;
    z-index: 1000; box-shadow: 0 10px 40px rgba(0, 212, 255, 0.4);
    opacity: 0; pointer-events: none; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    backdrop-filter: blur(10px);
  }
  #modalMensaje.mostrar { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }

  #modalTitulo { font-size: 1.4rem; color: #00d4ff; margin-bottom: 20px; font-weight: bold; text-shadow: 0 0 10px #00d4ff; }
  .modal-car-img { font-size: 4rem; margin: 15px 0; display: block; animation: flotar 3s ease-in-out infinite; }
  #modalTexto { font-size: 1.1rem; color: #e0e0e0; line-height: 1.6; margin-bottom: 25px; font-family: 'Courier New', Courier, monospace; }
  
  .btn-cerrar {
    background: #00d4ff; color: #000; border: none; padding: 10px 30px; border-radius: 20px;
    font-size: 1rem; font-weight: bold; cursor: pointer; box-shadow: 0 0 15px rgba(0, 212, 255, 0.5);
  }

  @keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

  @media (max-width: 768px) { 
    #ui-layer h1 { font-size: 1.6rem; }
    #ui-layer p { font-size: 1.1rem; }
  }
</style>
</head>
<body>

<!-- MÚSICA DE FONDO -->
<audio id="musicaFondo" loop crossorigin="anonymous">
  <source src="cancion.mp3" type="audio/mpeg">
</audio>

<!-- PANTALLA DE CARGA -->
<div id="pantallaEntrada">
  <div id="textoCarga">PREPARANDO TU UNIVERSO... 0%</div>
  <div class="barra-contenedor">
    <div class="barra-progreso" id="barraProgreso"></div>
  </div>
  <button id="btnDescubrir">DESCUBRIR</button>
</div>

<!-- CONTENEDOR 3D -->
<div id="threeCanvas"></div>

<!-- INTERFAZ -->
<div id="ui-layer">
  <h1>Feliz Día De Los Carritos Hot Wheels</h1>
  <p>Con Todo Mi Amor Para Ti</p>
</div>

<!-- TARJETA MODAL -->
<div id="modalMensaje">
  <div id="modalTitulo">Amarte es mi mejor decisión</div>
  <span class="modal-car-img">🏎️</span>
  <div id="modalTexto">Gracias por existir en mi vida.</div>
  <button class="btn-cerrar" onclick="cerrarModal()">✕</button>
</div>

<!-- LIBRERÍAS THREE.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
// --- 1. LÓGICA DE CARGA ---
let porcentaje = 0;
const textoCarga = document.getElementById('textoCarga');
const barraProgreso = document.getElementById('barraProgreso');
const btnDescubrir = document.getElementById('btnDescubrir');

const intervaloCarga = setInterval(() => {
  porcentaje += Math.floor(Math.random() * 8) + 2;
  if(porcentaje >= 100) {
    porcentaje = 100;
    clearInterval(intervaloCarga);
    textoCarga.innerText = "SISTEMA LISTO";
    textoCarga.style.color = "#00d4ff";
    barraProgreso.parentElement.style.display = 'none';
    btnDescubrir.style.display = 'block';
  }
  textoCarga.innerText = `PREPARANDO TU UNIVERSO... ${porcentaje}%`;
  barraProgreso.style.width = `${porcentaje}%`;
}, 150);

btnDescubrir.addEventListener('click', () => {
  document.getElementById('musicaFondo').play().catch(e=>console.log("Audio bloqueado", e));
  document.getElementById('pantallaEntrada').style.opacity = '0';
  setTimeout(() => { document.getElementById('pantallaEntrada').style.display = 'none'; }, 1000);
});

// --- 2. CONFIGURACIÓN DEL UNIVERSO 3D ---
let scene, camera, renderer, controls;
let universoGroup = new THREE.Group();
let carritosInteractivos = [];
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

// Textos flotantes del universo
const palabras = ["Amor", "Destino", "Mi paz", "Rayo", "Universo", "Confianza", "Brillamos", "Meta", "Velocidad", "Sueños", "Mi noche", "Único"];

// Mensajes para las tarjetas
const mensajesRomanticos = [
  { titulo: "Amarte es mi mejor decisión", texto: "Gracias por existir en mi vida y acelerar mi corazón todos los días." },
  { titulo: "Contigo todo tiene sentido", texto: "Tu amor es mi lugar favorito. Eres la chispa de mi motor." },
  { titulo: "Mi piloto favorito", texto: "No hay límite de velocidad para lo que siento por ti." },
  { titulo: "Universo de aventuras", texto: "Cada momento a tu lado es una carrera que nunca quiero terminar." },
  { titulo: "Eres mi meta", texto: "De todos los caminos posibles, siempre elegiré el que me lleve a ti." }
];

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x020205);
  scene.fog = new THREE.FogExp2(0x020205, 0.0003);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 10000);
  camera.position.set(0, 600, 1800); 

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  document.getElementById('threeCanvas').appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.8;
  controls.maxDistance = 3000;
  controls.minDistance = 500;

  scene.add(universoGroup);

  crearFondoEstelar();
  crearAgujeroNegro();
  crearGalaxiaDePalabrasYCarros();

  window.addEventListener('resize', onResize);
  renderer.domElement.addEventListener('pointerdown', onPointerDown);
}

// Generador de textos 3D flotantes
function crearSpriteTexto(texto, colorHex) {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = colorHex;
  ctx.font = 'bold 45px "Segoe UI", Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = colorHex;
  ctx.shadowBlur = 15;
  ctx.fillText(texto, 256, 64);
  
  const texture = new THREE.CanvasTexture(canvas);
  const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, blending: THREE.AdditiveBlending });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.set(300, 75, 1);
  return sprite;
}

// Generador de carritos deportivos en puro código Canvas (Carga instantánea)
function crearSpriteCarritoNeon(colorHex) {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  
  ctx.shadowColor = colorHex; ctx.shadowBlur = 20;
  ctx.strokeStyle = colorHex; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  
  // Dibujar silueta de auto deportivo
  ctx.beginPath();
  ctx.moveTo(30, 90); ctx.lineTo(30, 60); // Trasera
  ctx.lineTo(80, 50); // Vidrio trasero
  ctx.lineTo(130, 30); // Techo
  ctx.lineTo(180, 40); // Parabrisas
  ctx.lineTo(230, 60); // Capó
  ctx.lineTo(240, 90); // Trompa
  ctx.lineTo(30, 90); // Base
  ctx.stroke();
  
  // Ruedas
  ctx.beginPath(); ctx.arc(70, 90, 20, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(190, 90, 20, 0, Math.PI*2); ctx.stroke();
  
  // Detalle HW
  ctx.fillStyle = colorHex;
  ctx.font = 'bold 24px Arial';
  ctx.fillText('HW', 110, 75);

  const texture = new THREE.CanvasTexture(canvas);
  const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, blending: THREE.AdditiveBlending });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.set(180, 90, 1);
  return sprite;
}

function crearFondoEstelar() {
  const starGeo = new THREE.BufferGeometry();
  const starPos = [];
  for(let i=0; i<3000; i++) {
    starPos.push((Math.random()-0.5)*5000, (Math.random()-0.5)*5000, (Math.random()-0.5)*5000);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
  const starMat = new THREE.PointsMaterial({color: 0xffffff, size: 2, transparent: true, opacity: 0.5});
  scene.add(new THREE.Points(starGeo, starMat));
}

function crearAgujeroNegro() {
  const ringGeo = new THREE.RingGeometry(150, 220, 64);
  const ringMat = new THREE.MeshBasicMaterial({ color: 0x0055ff, side: THREE.DoubleSide, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2;
  universoGroup.add(ring);
  
  const sphereGeo = new THREE.SphereGeometry(145, 32, 32);
  const sphereMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
  universoGroup.add(new THREE.Mesh(sphereGeo, sphereMat));
}

function crearGalaxiaDePalabrasYCarros() {
  const colores = ['#00d4ff', '#ff0055', '#ffaa00', '#00ff88', '#bf00ff'];
  
  for(let i=0; i<200; i++) {
    const radio = 350 + Math.random() * 1600;
    const angulo = Math.random() * Math.PI * 2;
    const altura = (Math.random() - 0.5) * 600 * (1 - radio/2000); 
    
    const x = Math.cos(angulo) * radio;
    const y = altura;
    const z = Math.sin(angulo) * radio;

    let elemento;
    
    if (Math.random() > 0.25) {
      // Crear Palabra
      const palabraRandom = palabras[Math.floor(Math.random() * palabras.length)];
      const colorRandom = colores[Math.floor(Math.random() * colores.length)];
      elemento = crearSpriteTexto(palabraRandom, colorRandom);
    } else {
      // Crear Carrito
      const colorRandom = colores[Math.floor(Math.random() * colores.length)];
      elemento = crearSpriteCarritoNeon(colorRandom);
      
      // Hitbox invisible para detectar clics fácilmente
      const hitBoxGeo = new THREE.SphereGeometry(80, 8, 8);
      const hitBoxMat = new THREE.MeshBasicMaterial({visible: false});
      const hitbox = new THREE.Mesh(hitBoxGeo, hitBoxMat);
      elemento.add(hitbox);
      
      elemento.userData = { 
        esCarrito: true, 
        mensaje: mensajesRomanticos[Math.floor(Math.random() * mensajesRomanticos.length)] 
      };
      carritosInteractivos.push(hitbox); 
    }

    elemento.position.set(x, y, z);
    elemento.userData.anguloBase = angulo;
    elemento.userData.radio = radio;
    elemento.userData.velocidad = 0.001 + Math.random() * 0.002;
    
    universoGroup.add(elemento);
  }
}

// --- 3. LÓGICA DE CLICS Y TARJETAS ---
function onPointerDown(event) {
  let clientX = event.clientX || (event.touches ? event.touches[0].clientX : 0);
  let clientY = event.clientY || (event.touches ? event.touches[0].clientY : 0);

  mouse.x = (clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(carritosInteractivos);

  if (intersects.length > 0) {
    const carritoTocado = intersects[0].object.parent; 
    mostrarModal(carritoTocado.userData.mensaje);
    
    carritoTocado.scale.set(300, 150, 1);
    setTimeout(() => { carritoTocado.scale.set(180, 90, 1); }, 400);
  }
}

function mostrarModal(datos) {
  document.getElementById('modalTitulo').innerText = datos.titulo;
  document.getElementById('modalTexto').innerText = datos.texto;
  document.getElementById('modalMensaje').classList.add('mostrar');
}

function cerrarModal() {
  document.getElementById('modalMensaje').classList.remove('mostrar');
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// --- LOOP DE ANIMACIÓN ---
function animate() {
  requestAnimationFrame(animate);
  controls.update();

  universoGroup.rotation.y -= 0.001;

  universoGroup.children.forEach(child => {
    if(child.userData.radio) {
      child.userData.anguloBase += child.userData.velocidad;
      child.position.x = Math.cos(child.userData.anguloBase) * child.userData.radio;
      child.position.z = Math.sin(child.userData.anguloBase) * child.userData.radio;
    }
  });

  renderer.render(scene, camera);
}

init();
animate();
</script>
</body>
</html>
