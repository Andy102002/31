<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Feliz 30 de Septiembre ❤️</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Nunito:wght@800&display=swap');

  :root {
    --bg: #0b1021;
    --primary: #0055ff;
    --neon: #00d4ff;
    --hw-blue: #002299;
    --hw-red: #e60000;
    --hw-yellow: #ffcc00;
  }

  body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); overflow: hidden; font-family: 'Nunito', sans-serif; color: white; user-select: none; }

  /* --- PANTALLA DE CARGA --- */
  #loader {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 9999;
    display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s ease;
  }
  .loading-text { font-size: 1.5rem; color: var(--neon); letter-spacing: 2px; margin-bottom: 20px; animation: pulse 1.5s infinite; }
  .bar-bg { width: 250px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
  .bar-fill { width: 0%; height: 100%; background: linear-gradient(90deg, var(--primary), var(--neon)); transition: width 0.1s linear; }
  #btnStart {
    display: none; padding: 15px 40px; font-size: 1.2rem; text-transform: uppercase; border: 2px solid var(--neon);
    background: transparent; color: var(--neon); border-radius: 30px; cursor: pointer; margin-top: 30px;
    box-shadow: 0 0 15px rgba(0, 212, 255, 0.4); animation: pulse 2s infinite; font-family: 'Nunito', sans-serif; font-weight: 800;
  }
  #btnStart:hover { background: var(--neon); color: #000; }

  /* --- ESCENA 1: EL RAMO DEDICACODES --- */
  #escenaRamo {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, #111a3a 0%, var(--bg) 100%);
    z-index: 100; display: flex; align-items: center; justify-content: center; flex-direction: column;
    transition: opacity 1.5s ease;
  }

  .ramo-titulo { font-family: 'Caveat', cursive; font-size: 4rem; color: #fff; text-shadow: 0 0 15px var(--primary); margin-bottom: 20px; opacity: 0; animation: fadeIn 2s forwards 0.5s; z-index: 200; }

  /* Lienzo estricto de 400x600 que se escalará con JS */
  #canvas-ramo { position: relative; width: 400px; height: 500px; transform-origin: center center; }

  /* Elementos del ramo (Posiciones absolutas dentro del lienzo de 400x500) */
  .cono-atras {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 280px; height: 350px;
    background: linear-gradient(to bottom, #1e3a8a, #0f172a);
    clip-path: polygon(15% 0, 85% 0, 60% 100%, 40% 100%);
    opacity: 0; animation: popUpCono 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 1s; z-index: 1;
  }
  
  .tallos { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; z-index: 2; }
  .tallo { position: absolute; bottom: 50px; width: 6px; background: #15803d; transform-origin: bottom center; border-radius: 5px; opacity: 0; animation: growTallo 0.8s forwards; }
  
  .flores { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; z-index: 3; }
  .flor-svg { position: absolute; width: 80px; height: 80px; opacity: 0; transform-origin: center; animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.4)); }
  
  .autos { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; z-index: 4; }
  .auto-box {
    position: absolute; width: 80px; height: 120px; opacity: 0; cursor: pointer;
    background: linear-gradient(180deg, var(--hw-blue) 0%, #001144 100%); border-radius: 6px; border: 2px solid rgba(255,255,255,0.7); box-shadow: 0 10px 20px rgba(0,0,0,0.6);
    display: flex; flex-direction: column; align-items: center; transform-origin: center bottom;
    animation: popInAuto 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    transition: transform 0.2s, filter 0.2s;
  }
  .auto-box:hover { z-index: 50 !important; filter: brightness(1.2); }
  .auto-box .hueco { width: 20px; height: 6px; background: var(--bg); border-radius: 0 0 5px 5px; border: 1px solid rgba(255,255,255,0.4); border-top: none; margin-bottom: 5px; }
  .auto-box .logo { background: var(--hw-red); color: var(--hw-yellow); font-size: 0.45rem; font-weight: 900; font-style: italic; padding: 2px 6px; border-radius: 10px; margin-bottom: auto; }
  .auto-box img { width: 90%; height: 50px; object-fit: contain; margin-bottom: 10px; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.8)); }

  .cono-frente {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 300px; height: 220px;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    clip-path: polygon(0 0, 100% 0, 60% 100%, 40% 100%);
    opacity: 0; animation: popUpCono 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 5s; z-index: 10;
  }

  .lazo-btn {
    position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
    background: #ff0055; color: white; padding: 10px 30px; border-radius: 30px; font-weight: 800; font-size: 1.2rem;
    border: 3px solid #ff4d88; box-shadow: 0 10px 20px rgba(0,0,0,0.6); cursor: pointer; opacity: 0; z-index: 20;
    animation: popInBtn 1s forwards 6s, pulse 2s infinite 7s; transition: 0.2s;
  }
  .lazo-btn:hover { background: #cc0044; transform: translateX(-50%) scale(1.1); }
  .lazo-btn::before, .lazo-btn::after { content: ''; position: absolute; top: 10px; width: 40px; height: 30px; background: #cc0044; border-radius: 50%; z-index: -1; }
  .lazo-btn::before { left: -20px; transform: rotate(-20deg); }
  .lazo-btn::after { right: -20px; transform: rotate(20deg); }

  /* --- COORDENADAS EXACTAS DEL DISEÑO --- */
  /* Tallos */
  .t1 { left: 140px; height: 280px; transform: rotate(-25deg); animation-delay: 1.5s; }
  .t2 { left: 180px; height: 320px; transform: rotate(-10deg); animation-delay: 1.7s; }
  .t3 { left: 220px; height: 310px; transform: rotate(10deg); animation-delay: 1.9s; }
  .t4 { left: 250px; height: 260px; transform: rotate(25deg); animation-delay: 2.1s; }
  
  /* Flores SVG */
  .f1 { left: 50px; bottom: 250px; transform: rotate(-15deg); animation-delay: 2.3s; }
  .f2 { left: 150px; bottom: 300px; transform: rotate(5deg); animation-delay: 2.5s; width: 90px; height: 90px; }
  .f3 { left: 260px; bottom: 240px; transform: rotate(20deg); animation-delay: 2.7s; }
  .f4 { left: 100px; bottom: 180px; transform: rotate(-30deg); animation-delay: 4.5s; z-index: 15; } /* Flor frontal */
  .f5 { left: 220px; bottom: 190px; transform: rotate(30deg); animation-delay: 4.7s; z-index: 15; } /* Flor frontal */

  /* Cajas Hot Wheels */
  .a1 { left: 20px; bottom: 140px; --r: -25deg; animation-delay: 3.2s; }
  .a2 { left: 90px; bottom: 210px; --r: -10deg; animation-delay: 3.4s; }
  .a3 { left: 160px; bottom: 230px; --r: 0deg; animation-delay: 3.6s; z-index: 5;}
  .a4 { left: 230px; bottom: 210px; --r: 10deg; animation-delay: 3.8s; }
  .a5 { left: 300px; bottom: 140px; --r: 25deg; animation-delay: 4.0s; }
  .a6 { left: 160px; bottom: 120px; --r: 0deg; animation-delay: 4.2s; z-index: 6;}

  /* --- ESCENA 2: GALAXIA 3D --- */
  #threeCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; display: none; }
  #ui-galaxia { position: absolute; top: 30px; width: 100%; text-align: center; z-index: 10; display: none; pointer-events: none; }
  #ui-galaxia h1 { margin: 0; font-size: 3rem; color: #fff; text-shadow: 0 0 20px #ff0055, 0 0 40px var(--neon); font-family: 'Caveat', cursive; }
  #ui-galaxia p { margin-top: 10px; font-size: 1rem; color: #fff; background: rgba(0, 0, 0, 0.5); display: inline-block; padding: 5px 20px; border-radius: 20px; border: 1px solid var(--neon); text-transform: uppercase; }

  /* --- MODAL --- */
  #modal {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -45%) scale(0.9);
    background: rgba(255, 255, 255, 0.95); border: 4px solid var(--primary); border-radius: 15px;
    width: 85%; max-width: 350px; padding: 30px 20px; text-align: center; color: #111;
    z-index: 10000; box-shadow: 0 20px 50px rgba(0,0,0,0.8); opacity: 0; pointer-events: none; transition: 0.3s;
  }
  #modal.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
  #m-title { font-size: 1.5rem; color: var(--primary); margin-bottom: 10px; font-weight: 900; }
  .m-icon { font-size: 4rem; margin: 10px 0; display: block; animation: float 3s infinite; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.3));}
  #m-text { font-size: 1.2rem; margin-bottom: 25px; font-weight: 700; font-family: 'Caveat', cursive; color: #333;}
  .m-btn { background: var(--primary); color: #fff; border: none; padding: 10px 30px; border-radius: 20px; font-weight: 900; cursor: pointer; box-shadow: 0 5px 15px rgba(0, 85, 255, 0.4); }

  /* ANIMACIONES */
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes popUpCono { 0% { transform: translateX(-50%) translateY(100px) scale(0.5); opacity: 0; } 100% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; } }
  @keyframes growTallo { 0% { transform: scaleY(0); opacity: 0; } 100% { transform: scaleY(1); opacity: 1; } }
  @keyframes popIn { 0% { transform: scale(0) rotate(-45deg); opacity: 0; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
  @keyframes popInAuto { 0% { transform: translateY(100px) scale(0) rotate(var(--r)); opacity: 0; } 100% { transform: translateY(0) scale(1) rotate(var(--r)); opacity: 1; } }
  @keyframes popInBtn { 0% { transform: translateX(-50%) scale(0); opacity: 0; } 100% { transform: translateX(-50%) scale(1); opacity: 1; } }
</style>
</head>
<body>

<!-- SVG FLOR PERFECTA -->
<svg style="display: none;">
  <defs>
    <g id="flor-svg">
      <path d="M40 20 C45 0, 70 15, 40 40 C15 15, 35 0, 40 20" fill="#00aaff" stroke="#0055ff" stroke-width="2"/>
      <path d="M40 40 C70 15, 85 40, 40 40" fill="#0088ff" stroke="#0044cc" stroke-width="2" transform="rotate(72 40 40)"/>
      <path d="M40 40 C70 15, 85 40, 40 40" fill="#0066ff" stroke="#0033aa" stroke-width="2" transform="rotate(144 40 40)"/>
      <path d="M40 40 C70 15, 85 40, 40 40" fill="#0044ff" stroke="#002288" stroke-width="2" transform="rotate(216 40 40)"/>
      <path d="M40 40 C70 15, 85 40, 40 40" fill="#0022cc" stroke="#001155" stroke-width="2" transform="rotate(288 40 40)"/>
      <circle cx="40" cy="40" r="12" fill="#ffcc00" stroke="#e60000" stroke-width="3"/>
    </g>
  </defs>
</svg>

<audio id="musicaFondo" loop crossorigin="anonymous"><source src="cancion.mp3" type="audio/mpeg"></audio>

<!-- 1. CARGA -->
<div id="loader">
  <div class="loading-text" id="loaderText">ENSAMBLANDO SORPRESA... 0%</div>
  <div class="bar-bg"><div class="bar-fill" id="loaderBar"></div></div>
  <button id="btnStart">ABRIR REGALO</button>
</div>

<!-- 2. ESCENA RAMO (Lienzo escalable) -->
<div id="escenaRamo">
  <div class="ramo-titulo">❤️ Feliz 30 de Septiembre ❤️</div>
  
  <div id="canvas-ramo">
    <!-- Capa 1: Fondo -->
    <div class="cono-atras"></div>
    
    <!-- Capa 2: Tallos -->
    <div class="tallos">
      <div class="tallo t1"></div><div class="tallo t2"></div><div class="tallo t3"></div><div class="tallo t4"></div>
    </div>
    
    <!-- Capa 3: Flores Traseras -->
    <div class="flores">
      <svg class="flor-svg f1" viewBox="0 0 80 80"><use href="#flor-svg"/></svg>
      <svg class="flor-svg f2" viewBox="0 0 80 80"><use href="#flor-svg"/></svg>
      <svg class="flor-svg f3" viewBox="0 0 80 80"><use href="#flor-svg"/></svg>
    </div>
    
    <!-- Capa 4: Autos -->
    <div class="autos">
      <div class="auto-box a1" onclick="abrirModal('MI ALEGRÍA', 'Haces que mi vida sea más bonita')">
        <div class="hueco"></div><div class="logo">HOT WHEELS</div><img src="auto1.png" onerror="this.style.display='none'">
      </div>
      <div class="auto-box a2" onclick="abrirModal('TE AMO', 'No necesito calendario para amarte')">
        <div class="hueco"></div><div class="logo">HOT WHEELS</div><img src="auto2.png" onerror="this.style.display='none'">
      </div>
      <div class="auto-box a3" onclick="abrirModal('TE ADORO', 'Creo en ti siempre')">
        <div class="hueco"></div><div class="logo">HOT WHEELS</div><img src="auto3.png" onerror="this.style.display='none'">
      </div>
      <div class="auto-box a4" onclick="abrirModal('ERES VALIOSO', 'Éxito en cada meta que persigas')">
        <div class="hueco"></div><div class="logo">HOT WHEELS</div><img src="auto4.png" onerror="this.style.display='none'">
      </div>
      <div class="auto-box a5" onclick="abrirModal('MI PILOTO', 'Aceleras mi mundo')">
        <div class="hueco"></div><div class="logo">HOT WHEELS</div><img src="auto5.png" onerror="this.style.display='none'">
      </div>
      <div class="auto-box a6" onclick="abrirModal('MI TODO', 'Gracias por existir')">
        <div class="hueco"></div><div class="logo">HOT WHEELS</div><img src="auto6.png" onerror="this.style.display='none'">
      </div>
    </div>

    <!-- Capa 5: Flores Frontales -->
    <div class="flores">
      <svg class="flor-svg f4" viewBox="0 0 80 80"><use href="#flor-svg"/></svg>
      <svg class="flor-svg f5" viewBox="0 0 80 80"><use href="#flor-svg"/></svg>
    </div>

    <!-- Capa 6: Envoltura Frontal -->
    <div class="cono-frente"></div>
    
    <!-- Capa 7: Botón Lazo -->
    <button class="lazo-btn" onclick="goGalaxy()">GALAXIA 🌌</button>
  </div>
</div>

<!-- 3. ESCENA GALAXIA -->
<div id="threeCanvas"></div>
<div id="ui-galaxia">
  <h1>❤️ Feliz 30 de Septiembre ❤️</h1>
  <p>👆 Gira el universo y toca un auto 🏎️</p>
</div>

<!-- MODAL -->
<div id="modal">
  <div id="m-title">Titulo</div>
  <span class="m-icon">🐻❤️🐼</span>
  <div id="m-text">Texto</div>
  <button class="m-btn" onclick="cerrarModal()">CONTINUAR</button>
</div>

<!-- SCRIPTS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
// SCALING DEL LIENZO PARA QUE NO SE ROMPA EN NINGÚN CELULAR/PC
function resizeCanvas() {
  const canvas = document.getElementById('canvas-ramo');
  const scale = Math.min(window.innerWidth / 450, window.innerHeight / 750);
  canvas.style.transform = `scale(${scale > 1 ? 1 : scale})`;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas(); // Llamada inicial

// LOADER
let pct = 0;
const loadInt = setInterval(() => {
  pct += Math.floor(Math.random() * 10) + 5;
  if(pct >= 100) {
    pct = 100; clearInterval(loadInt);
    document.getElementById('loaderText').innerText = "¡SISTEMA LISTO!";
    document.querySelector('.bar-bg').style.display = 'none';
    document.getElementById('btnStart').style.display = 'block';
  } else {
    document.getElementById('loaderText').innerText = `ENSAMBLANDO SORPRESA... ${pct}%`;
    document.getElementById('loaderBar').style.width = `${pct}%`;
  }
}, 100);

document.getElementById('btnStart').addEventListener('click', () => {
  document.getElementById('musicaFondo').play().catch(e=>{});
  document.getElementById('loader').style.opacity = '0';
  setTimeout(() => document.getElementById('loader').style.display = 'none', 800);
});

// MODAL
function abrirModal(t, txt) {
  document.getElementById('m-title').innerText = t;
  document.getElementById('m-text').innerText = txt;
  document.getElementById('modal').classList.add('show');
}
function cerrarModal() { document.getElementById('modal').classList.remove('show'); }

// TRANSICIÓN
function goGalaxy() {
  const ramo = document.getElementById('escenaRamo');
  ramo.style.opacity = '0';
  setTimeout(() => {
    ramo.style.display = 'none';
    document.getElementById('threeCanvas').style.display = 'block';
    document.getElementById('ui-galaxia').style.display = 'block';
    initThreeJS();
  }, 1500);
}

// GALAXIA THREEJS
const bancoMsj = [
  { t: "MI MEJOR DECISIÓN", p: "Amarte ha sido la carrera más hermosa." },
  { t: "SIN FRENOS", p: "Me enamoré de ti sin frenos y sin marcha atrás." },
  { t: "MI PILOTO", p: "Aceleras mi corazón todos los días." },
  { t: "HOT WHEELS", p: "Gracias por dejarme hacer feliz a tu niño interior." },
  { t: "MI META", p: "De todos los caminos, te elegiré a ti." }
];

let scene, camera, renderer, controls;
let universoGroup = new THREE.Group();
let carritos = [];
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function initThreeJS() {
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x0b1021); scene.fog = new THREE.FogExp2(0x0b1021, 0.0003);
  camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 1, 15000); camera.position.set(0, 400, 1500);
  renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(window.innerWidth, window.innerHeight);
  document.getElementById('threeCanvas').appendChild(renderer.domElement);
  
  controls = new THREE.OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.autoRotate = true; controls.autoRotateSpeed = 0.8;

  scene.add(universoGroup);
  
  // Estrellas
  const starGeo = new THREE.BufferGeometry(); const starPos = [];
  for(let i=0; i<3000; i++) starPos.push((Math.random()-0.5)*5000, (Math.random()-0.5)*5000, (Math.random()-0.5)*5000);
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0xcceeff, size: 2, transparent: true, opacity: 0.6})));

  // Agujero Negro
  const disk = new THREE.Group();
  disk.add(new THREE.Mesh(new THREE.RingGeometry(180, 260, 64), new THREE.MeshBasicMaterial({color: 0x00d4ff, side: THREE.DoubleSide, transparent: true, opacity: 0.8})));
  disk.rotation.x = Math.PI/2; universoGroup.add(disk);
  universoGroup.add(new THREE.Mesh(new THREE.SphereGeometry(175, 32, 32), new THREE.MeshBasicMaterial({ color: 0x000000 })));

  // Autos
  const loader = new THREE.TextureLoader();
  const tex = [loader.load('auto1.png'), loader.load('auto2.png'), loader.load('auto3.png'), loader.load('auto4.png'), loader.load('auto5.png'), loader.load('auto6.png')];
  
  for(let i=0; i<30; i++) {
    const r = 400 + Math.random()*1500; const a = Math.random()*Math.PI*2;
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex[Math.floor(Math.random()*tex.length)], transparent: true }));
    sprite.scale.set(180, 90, 1); sprite.position.set(Math.cos(a)*r, (Math.random()-0.5)*400, Math.sin(a)*r);
    sprite.userData = { m: bancoMsj[Math.floor(Math.random()*bancoMsj.length)], aBase: a, radio: r, vel: 0.001 + Math.random()*0.001 };
    carritos.push(sprite); universoGroup.add(sprite);
  }

  window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
  renderer.domElement.addEventListener('pointerdown', e => { tiempoInicio = Date.now(); posInicio = {x: e.clientX, y: e.clientY}; });
  renderer.domElement.addEventListener('pointerup', onPointerUp);
  animate();
}

let posInicio = {x:0, y:0}, tiempoInicio = 0;
function onPointerUp(e) {
  if (Math.hypot(e.clientX - posInicio.x, e.clientY - posInicio.y) < 15 && Date.now() - tiempoInicio < 400) {
    mouse.x = (e.clientX / window.innerWidth)*2 - 1; mouse.y = -(e.clientY / window.innerHeight)*2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(carritos);
    if (hits.length > 0) {
      abrirModal(hits[0].object.userData.m.t, hits[0].object.userData.m.p);
      hits[0].object.scale.set(250, 125, 1); setTimeout(() => hits[0].object.scale.set(180, 90, 1), 300);
    }
  }
}

function animate() {
  requestAnimationFrame(animate); controls.update();
  universoGroup.children.forEach(c => {
    if(c.userData.radio) {
      c.userData.aBase += c.userData.vel;
      c.position.x = Math.cos(c.userData.aBase) * c.userData.radio;
      c.position.z = Math.sin(c.userData.aBase) * c.userData.radio;
    }
  });
  renderer.render(scene, camera);
}
</script>
</body>
</html>
